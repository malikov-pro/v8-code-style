FormItemExplicitColorCheck_title = Explicit color value in form items
FormItemExplicitColorCheck_description = Use style items to change the appearance of form controls instead of setting concrete color values (text color, back color, etc.) directly in the items - this keeps similar controls looking the same in all forms. The check reports each color property (text color and its variants, back color and its variants) that has a concrete color value (RGB) set in a form item or its ext info: item title text/back color, button text/back color, field footer text/back color, table text/back color, decoration text color, ext info text/back colors of input, label, check box, image, radio buttons, text document and formatted document fields, group back colors (including the hidden state title back color and the column group title back color), and text/back colors of table additions (search string, view status, search control). A style item color reference, a web color, a palette color and "auto" are not reported. Border colors, picture colors and the view status button color are not checked. Base forms of extensions (borrowed from the main configuration without own changes) are not checked. Ported from the upstream issue 1C-Company/v8-code-style#765 (standard 667).
FormItemExplicitColorCheck_message = Explicit color value {0} is set for form item "{1}" (property "{2}"); use style items instead

ApkChoiceHistoryFieldButtonsCheck_title = Form field properties for objects with disabled choice history on input

ApkChoiceHistoryFieldButtonsCheck_description = After the choice history on input is disabled in the properties of a metadata object, all form input fields referring to this object must have: the drop-down list button set to off, the choice button set to on and the choice button representation set to "in input field". Otherwise, before the selection starts, the user gets into a menu where they have to press "show all" every time. Fields with the list choice mode and a choice list filled in metadata, objects with quick choice and read-only fields (also inside read-only groups or tables) are not checked, as such elements are not available for the value selection. The АПК rule 00617 (standard 744, clause 2.2).

ApkChoiceHistoryFieldButtonsCheck_message = Form field "{0}" refers to metadata object "{1}" with disabled choice history on input: set the drop-down list button to off, the choice button to on and the choice button representation to "in input field"
