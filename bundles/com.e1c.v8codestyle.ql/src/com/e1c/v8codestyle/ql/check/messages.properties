QueryArithmeticCastCheck_title = Rounding of arithmetic operation results in queries

QueryArithmeticCastCheck_description = Checks queries where the result of a division operation or the AVERAGE (СРЕДНЕЕ) aggregate function is not wrapped in a CAST(... AS Number(m, n)) expression. On different DBMS the precision of such calculations may differ from 8 decimal places, which leads to loss of precision of query results. Apply CAST(... AS Number(m, n)) to the operation result or to its operands; keep the specified total precision minimal but sufficient for each operand. The check is an audit: the required precision depends on the application, so each case is only reported. Multiplication is not checked because operands that may have a fractional part cannot be determined statically. Disabled by default - enable it to audit arithmetic operations in the project. Ported from the APK check АПК_00212.

QueryArithmeticCastCheck_Division_result_should_be_cast_to_number = The division result may lose precision on different DBMS: wrap the operation or its operands in CAST(... AS Number(m, n))

QueryArithmeticCastCheck_Average_function_result_should_be_cast_to_number = The AVERAGE (СРЕДНЕЕ) function result may lose precision on different DBMS: wrap the function or its parameter in CAST(... AS Number(m, n))

QueryCastStringCheck_title = Using CAST(... AS STRING(N)) in queries

QueryCastStringCheck_description = Checks queries that use CAST(... AS STRING(N)) (ВЫРАЗИТЬ(... КАК СТРОКА(N))). Unlimited-length strings have to be truncated in queries for comparison, grouping and distinct; however frequent casting is a sign of a wrong design decision - consider revising the string attribute type in favor of a limited-length string. Make sure the specified length is sufficient for the expression to be evaluated correctly. The check is an audit: sufficiency of the length can only be proven by the developer, so each casting is only reported. Disabled by default - enable it to audit string casting in the project. Ported from the APK check АПК_00142. See also the md check apk-00141-unlimited-string that reports the unlimited-length attributes themselves.

QueryCastStringCheck_Cast_to_limited_string_usage_should_be_verified = Verify that casting the string to a limited length is reasonable and the specified length is sufficient: frequent casting may be a sign of a wrong design decision

UsingForUpdateCheck_description = Check if query contains "FOR UPDATE"

UsingForUpdateCheck_title = Using "FOR UPDATE" clause

UsingAllowedKeywordCheck_title = Using the ALLOWED keyword in queries

UsingAllowedKeywordCheck_description = Checks queries that use the ALLOWED keyword (РАЗРЕШЕННЫЕ). It hides records the user has no rights for, which may distort the query result: the user sees incomplete data while the business logic expects all of it. Allow it only where the user must see everything they are permitted to (dynamic lists, interactive reports); avoid it in queries that affect calculations and operations. The check is an audit: legitimate usage depends on the role of the query, so each usage is only reported. Disabled by default - enable it to audit ALLOWED usage in the project. Ported from the APK check АПК_00429 (standard 415).

UsingAllowedKeywordCheck_Allowed_keyword_usage_should_be_verified = Verify the usage of the ALLOWED keyword: it hides records the user has no rights for and may distort the query result

