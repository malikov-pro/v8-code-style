QueryArithmeticCastCheck_title = Округление результатов арифметических операций в запросах

QueryArithmeticCastCheck_description = Проверяет запросы, в которых результат операции деления или агрегатной функции СРЕДНЕЕ (AVG) не обрамлён оператором ВЫРАЗИТЬ(... КАК Число(m, n)). Из-за особенностей работы различных СУБД точность таких вычислений может отличаться от 8 разрядов дробной части, что приводит к потере точности результатов запроса. Применяйте ВЫРАЗИТЬ(... КАК Число(m, n)) к результату операции или к её операндам; указанная общая разрядность должна быть минимальной, но достаточной для представления значений каждого из операндов. Проверка по сути аудит: необходимая точность зависит от прикладного решения, поэтому каждый случай только помечается. Умножение не проверяется: статически не определить, может ли каждый из множителей иметь дробную часть. Выключена по умолчанию - включите для аудита арифметических операций в проекте. Перенос проверки АПК АПК_00212.

QueryArithmeticCastCheck_Division_result_should_be_cast_to_number = Результат деления может терять точность на разных СУБД: примените ВЫРАЗИТЬ(... КАК Число(m, n)) к операции или её операндам

QueryArithmeticCastCheck_Average_function_result_should_be_cast_to_number = Результат функции СРЕДНЕЕ (AVG) может терять точность на разных СУБД: примените ВЫРАЗИТЬ(... КАК Число(m, n)) к функции или её параметру

