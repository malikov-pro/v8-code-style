UsingForUpdateCheck_title = Использование конструкции "ДЛЯ ИЗМЕНЕНИЯ"

UsingAllowedKeywordCheck_title = Использование ключевого слова РАЗРЕШЕННЫЕ в запросах

UsingAllowedKeywordCheck_description = Проверяет запросы, использующие ключевое слово РАЗРЕШЕННЫЕ. Оно скрывает строки, к которым у пользователя нет прав, что может искажать результат запроса: пользователь видит не все данные, а бизнес-логика рассчитывает на полные данные. Допустимо там, где пользователь обязан видеть всё разрешённое ему (динамические списки, интерактивные отчёты); недопустимо в запросах, влияющих на расчёты и проведение операций. Проверка по сути аудит: законность использования зависит от роли запроса, поэтому каждое использование только помечается. Выключена по умолчанию - включите для аудита использования РАЗРЕШЕННЫЕ в проекте. Перенос проверки АПК АПК_00429 (статья 415 стандарта).

UsingAllowedKeywordCheck_Allowed_keyword_usage_should_be_verified = Проверьте необходимость ключевого слова РАЗРЕШЕННЫЕ: оно скрывает строки, к которым у пользователя нет прав, и может искажать результат запроса

