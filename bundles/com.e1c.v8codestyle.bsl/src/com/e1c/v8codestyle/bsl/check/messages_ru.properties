UseGotoOperatorCheck_description = Использован оператор Перейти

UseGotoOperatorCheck_title = Использован оператор Перейти

UnknownFormParameterAccessCheck_Unknown_form_parameter_access = Обращение к несуществующему параметру формы "{0}"

UnknownFormParameterAccessCheck_description = Обращение к несуществующему параметру формы

UnknownFormParameterAccessCheck_title = Обращение к несуществующему параметру формы

UseNonRecommendedMethods_description = Использование не рекомендованных методов

UseNonRecommendedMethods_message = Используется не рекомендуемый метод

UseNonRecommendedMethods_parameter = Список дополнительных не рекомендуемых методов для проверки

UseNonRecommendedMethods_title = Использование не рекомендуемых методов

VariableNameInvalidCheck_description = Имя переменной введено некорректно

VariableNameInvalidCheck_message_variable_length_is_less_than = длина переменной меньше, чем {0}

VariableNameInvalidCheck_param_MIN_NAME_LENGTH_PARAM_title = Мин. длина переменной

VariableNameInvalidCheck_title = Имя переменной введено некорректно

VariableNameInvalidCheck_variable_name_is_invalid = Имя переменной {0} введено некорректно: {1}

VariableNameInvalidCheck_variable_name_must_start_with_a_capital_letter = имя переменной должно начинаться с заглавной буквы

VariableNameInvalidCheck_variable_name_starts_with_an_underline = имя переменной начинается с символа подчеркивания

EmptyStatementCheck_title = Пустой оператор
EmptyStatementCheck_description = Проверяет, что в модуле нет пустых операторов «;». Лишняя точка с запятой — мусор, затрудняющий чтение кода.
EmptyStatementCheck_Remove_empty_statement = Удалите ";"

UselessTernaryOperatorCheck_title = Бесполезный тернарный оператор
UselessTernaryOperatorCheck_description = Проверяет тернарный оператор ?(Условие, Ветка1, Ветка2), результат которого известен заранее: условие — булева константа, либо обе ветки — булевы константы (?(X, Истина, Ложь) — это X, ?(X, Ложь, Истина) — это НЕ X), либо обе ветки одинаковы.
UselessTernaryOperatorCheck_Useless_ternary_operator = Бесполезный тернарный оператор

TernaryOperatorUsageCheck_title = Использование тернарного оператора
TernaryOperatorUsageCheck_description = Вместо тернарного оператора рекомендуется использовать конструкцию «Если … Тогда … Иначе». Проверка по умолчанию отключена (как в BSL Language Server), включается в настройках проверок.
TernaryOperatorUsageCheck_Use_if_instead_of_ternary_operator = Используйте конструкцию Если-Иначе вместо тернарного оператора

NestedTernaryOperatorCheck_title = Вложенный тернарный оператор
NestedTernaryOperatorCheck_description = Вложенные тернарные операторы и тернарные операторы в условиях «Если»/«ИначеЕсли» читаются с трудом. Используйте конструкции «Если … Тогда … Иначе» и промежуточные переменные.
NestedTernaryOperatorCheck_Nested_ternary_operator = Не рекомендуется использовать вложенный тернарный оператор

IfElseDuplicatedCodeBlockCheck_title = Повторяющиеся блоки кода в операторе «Если»
IfElseDuplicatedCodeBlockCheck_description = Проверяет, что синтаксическая конструкция «Если…Тогда…ИначеЕсли…» не содержит повторяющихся блоков кода. Дублирующаяся ветвь — вероятная ошибка копипасты либо признак лишнего условия.
IfElseDuplicatedCodeBlockCheck_Duplicated_code_block = Синтаксическая конструкция "Если...Тогда...ИначеЕсли..." содержит повторяющиеся блоки кода (ветка {0} повторяет ветку {1})

IdenticalExpressionsCheck_title = Одинаковые выражения слева и справа от оператора
IdenticalExpressionsCheck_description = Проверяет бинарные выражения с одинаковыми левым и правым операндами, например «А = А» или «А = 1 И А = 1». Обычно это ошибка: оператор не делает того, что ожидал автор. Повтор операнда в сложении и умножении допустим; деление на популярные делители (параметр, по умолчанию «60, 1024») ошибкой не считается.
IdenticalExpressionsCheck_Identical_expressions = Слева и справа от оператора "{0}" находятся одинаковые подвыражения: "{1}"
IdenticalExpressionsCheck_Popular_divisors = Популярные делители (через запятую), которые не считаются ошибкой повтора операнда в операции деления

RewriteMethodParameterCheck_title = Перезапись параметров метода
RewriteMethodParameterCheck_description = Проверяет, что параметр, переданный по значению (Знач), не перезаписывается до первого использования. Переданное значение теряется — вероятная ошибка. Модификация вида «Параметр = Параметр + 1» перезаписью не считается; параметры без Знач (по ссылке) не проверяются (как в BSL LS).
RewriteMethodParameterCheck_Parameter_rewrite_without_use = Параметр "{0}" перезаписывается без использования

OneStatementPerLineCheck_title = Одно выражение в одной строке
OneStatementPerLineCheck_description = Проверяет, что строка содержит один оператор. Несколько операторов в одной строке затрудняют чтение и отладку кода. Препроцессорные инструкции и пустые операторы не учитываются; замечание ставится на каждый оператор строки (как в BSL LS).
OneStatementPerLineCheck_Move_to_new_line = Перенесите выражение на новую строку

UsingHardcodePathCheck_title = Хранение путей к файлам в коде
UsingHardcodePathCheck_description = Проверяет строковые литералы на пути к файлам и каталогам Windows/Unix. Хардкодный путь зависит от машины, на которой выполняется код. URL (ftp/http/https) не проверяются; Unix-пути проверяются только на стандартные корневые каталоги (параметр). Проверка не имеет quick fix: способ хранения пути — решение пользователя (настройка/константа).
UsingHardcodePathCheck_Hardcode_path = Используется хранение в коде пути к файлу: «{0}»
UsingHardcodePathCheck_Std_paths_unix = Ключевые слова поиска стандартных корневых каталогов Unix (через |)

UsingHardcodeNetworkAddressCheck_title = Хранение ip-адресов в коде
UsingHardcodeNetworkAddressCheck_description = Проверяет строковые литералы на IPv4/IPv6-адреса. Хардкодный адрес зависит от окружения, в котором выполняется код. URL не проверяются; значения, похожие на версии (параметр), и операторы со словами-исключениями (параметр) пропускаются. Проверка не имеет quick fix: способ хранения адреса — решение пользователя (настройка/константа).
UsingHardcodeNetworkAddressCheck_Hardcode_ip_address = Используется хранение в коде ip-адреса: «{0}»
UsingHardcodeNetworkAddressCheck_Exclusion_words = Ключевые слова для исключения операторов из поиска (через |)
UsingHardcodeNetworkAddressCheck_Popular_version_exclusion = Регулярное выражение для исключения популярных версий из поиска

UsingHardcodeSecretInformationCheck_title = Хранение конфиденциальной информации в коде
UsingHardcodeSecretInformationCheck_description = Проверяет код на хранение конфиденциальной информации (паролей): присваивание переменной, ключ или свойство структуры/соответствия, метод «Вставить», конструктор «Новый Структура(...)», пароль соединения FTP/HTTP. Замаскированные значения («***») не фиксируются. Проверка не имеет quick fix: хранение пароля — решение пользователя (БезопасноеХранение/настройки).
UsingHardcodeSecretInformationCheck_Hardcode_secret = Используется хранение конфиденциальной информации в коде: «{0}»
UsingHardcodeSecretInformationCheck_Hardcode_secret_in_connection = Используется хранение конфиденциальной информации (пароль соединения) в коде: «{0}»
UsingHardcodeSecretInformationCheck_Search_words = Ключевые слова поиска конфиденциальной информации в переменных, структурах, соответствиях (через |)

DeprecatedFindCheck_title = Использование устаревшего метода «Найти»
DeprecatedFindCheck_description = Проверяет использование устаревшего глобального метода «Найти». Используйте «СтрНайти»: у неё ясная семантика аргументов и больше возможностей поиска. Методы объекта (Объект.Найти) не проверяются. Эта проверка замещает Найти в дефолтном списке use-non-recommended-method.
DeprecatedFindCheck_Use_StrFind_instead_of_Find = Используйте «СтрНайти» вместо устаревшего «Найти»

DeprecatedCurrentDateCheck_title = Использование устаревшего метода «ТекущаяДата»
DeprecatedCurrentDateCheck_description = Проверяет использование устаревшего метода «ТекущаяДата»: текущее время может отличаться на клиенте и сервере, что приводит к непредсказуемому поведению. Используйте «ТекущаяДатаСеанса». Эта проверка замещает ТекущаяДата в дефолтном списке use-non-recommended-method.
DeprecatedCurrentDateCheck_Use_CurrentSessionDate_instead_of_CurrentDate = Используйте «ТекущаяДатаСеанса» вместо устаревшего «ТекущаяДата»

SpaceAtStartCommentCheck_title = Пробел в начале комментария
SpaceAtStartCommentCheck_description = Проверяет, что текст комментария отделён от «//» пробелом. Комментарии-аннотации (параметр, по умолчанию «//@,//(c),//©») и комментарии, похожие на закомментированный код, не фиксируются (как в BSL LS).
SpaceAtStartCommentCheck_Space_at_comment_start = Между символами комментария «//» и самим текстом комментария должен быть пробел
SpaceAtStartCommentCheck_Comments_annotation = Пропускать комментарии-аннотации, начинающиеся с указанных подстрок (через запятую)

CommentedCodeCheck_title = Закомментированный фрагмент кода
CommentedCodeCheck_description = Проверяет, что программные модули не содержат закомментированных фрагментов кода: место неиспользуемого кода — в системе контроля версий, а не в комментариях. Смежные строки комментариев группируются; группа фиксируется, если распознаётся как код (порог — параметр, по умолчанию 0.9, как в BSL LS). Документирующие шапки методов не фиксируются; префиксы исключений можно задать параметром.
CommentedCodeCheck_Commented_out_code = Программные модули не должны иметь закомментированных фрагментов кода
CommentedCodeCheck_Threshold = Порог чувствительности (от 0 до 1)
CommentedCodeCheck_Exclusion_prefixes = Префиксы исключений (через запятую); комментарий, начинающийся с одного из них, не анализируется

OSUsersMethodCheck_title = Использование метода ПользователиОС
OSUsersMethodCheck_description = Проверяет использование метода «ПользователиОС». Получение информации о пользователях операционной системы потенциально опасно: требует обоснования и ограничения доступа.
OSUsersMethodCheck_Check_potentially_malicious_use_of_OS_users_method = Проверить потенциально вредоносное использование метода ПользователиОС

TimeoutsInExternalResourcesCheck_title = Таймауты при работе с внешними ресурсами
TimeoutsInExternalResourcesCheck_description = Проверяет, что при создании FTPСоединение, HTTPСоединение, WSОпределения, WSПрокси и ИнтернетПочтовыйПрофиль указан таймаут: заполнен параметр конструктора таймаута или ниже по коду переменной присвоено свойство «Таймаут» числом или переменной. Без таймаута сеанс может зависнуть неопределённо долго.
TimeoutsInExternalResourcesCheck_Timeout_not_specified = Не указан таймаут при работе с внешним ресурсом
TimeoutsInExternalResourcesCheck_Analyze_mail = Анализировать таймаут у «ИнтернетПочтовыйПрофиль»

MissingSpaceCheck_title = Отсутствует пробел
MissingSpaceCheck_description = Проверяет пробелы вокруг знаков операций (=, <, >, <=, >=, <>, %, +, -, *, /) и после запятой и точки с запятой. Комментарии и строковые литералы не анализируются. Знаки арифметики проверяются только слева (справа от унарного знака не проверяется — как в BSL LS по умолчанию).
MissingSpaceCheck_Missing_space = Отсутствует пробел {0} от знака «{1}»
MissingSpaceCheck_Left = слева
MissingSpaceCheck_Right = справа

MagicNumberCheck_title = Магическое число
MagicNumberCheck_description = Проверяет код на магические числа. Вместо необъяснённых чисел используйте именованные константы. Не фиксируются разрешённые числа (параметр, по умолчанию «-1, 0, 1»), индексный доступ (параметр), значения по умолчанию параметров методов и плоские компоненты вызова «Дата(...)».
MagicNumberCheck_Magic_number = Магическое число «{0}»
MagicNumberCheck_Authorized_numbers = Разрешённые числа (через запятую)
MagicNumberCheck_Allow_magic_indexes = Разрешить магические числа в индексном доступе

MagicDateCheck_title = Магическая дата
MagicDateCheck_description = Проверяет код на магические даты (литералы вида '20260101'). Вместо них используйте именованные константы или результаты функций. Пустая дата и разрешённые даты (параметр) не фиксируются; как в BSL LS, не фиксируются правая часть простого присваивания и выражение «Возврат».
MagicDateCheck_Magic_date = Магическая дата «{0}»
MagicDateCheck_Authorized_dates = Разрешённые даты (через запятую)

IfConditionComplexityCheck_title = Сложное условие в операторе «Если»
IfConditionComplexityCheck_description = Проверяет, что в условии «Если»/«ИначеЕсли» не больше логических операций «И»/«ИЛИ», чем максимум (параметр, по умолчанию 3, как в BSL LS). Сложное условие разбивайте на промежуточные переменные или отдельные операторы.
IfConditionComplexityCheck_Too_many_conditions = В условии слишком много логических операций: {0} (максимум {1})
IfConditionComplexityCheck_Max_condition_complexity = Максимум логических операций в условии

NestedStatementsCheck_title = Слишком большая вложенность операторов
NestedStatementsCheck_description = Проверяет глубину вложенности операторов «Если», циклов и «Попытки»: глубокая вложенность затрудняет чтение и сопровождение кода (параметр, по умолчанию 4, как в BSL LS). Фиксируются операторы на уровнях глубже максимума.
NestedStatementsCheck_Too_many_nested_statements = Слишком большая вложенность операторов: уровень {0} (максимум {1})
NestedStatementsCheck_Max_allowed_level = Максимальный уровень вложенности

CyclomaticComplexityCheck_title = Цикломатическая сложность метода выше допустимой
CyclomaticComplexityCheck_description = Проверяет цикломатическую сложность метода: 1 плюс число ветвей «Если»/«ИначеЕсли», циклов, операций «И»/«ИЛИ» и тернарников (параметр, по умолчанию 20, как в BSL LS). Сложный метод разбивайте на несколько.
CyclomaticComplexityCheck_Cyclomatic_complexity = Цикломатическая сложность метода {0} (максимум {1})
CyclomaticComplexityCheck_Complexity_threshold = Порог цикломатической сложности

CognitiveComplexityCheck_title = Когнитивная сложность метода выше допустимой
CognitiveComplexityCheck_description = Проверяет когнитивную сложность метода: каждая структура «Если»/«ИначеЕсли»/цикл/«Попытка» добавляет 1 плюс свою глубину вложенности, каждое «И»/«ИЛИ» — 1 (упрощённый перенос BSL LS, порог по умолчанию 15). Сложный метод разбивайте на несколько.
CognitiveComplexityCheck_Cognitive_complexity = Когнитивная сложность метода {0} (максимум {1})
CognitiveComplexityCheck_Complexity_threshold = Порог когнитивной сложности

UsingModalWindowsCheck_title = Использование модальных окон
UsingModalWindowsCheck_description = Проверяет использование модальных методов (Вопрос, ОткрытьФормуМодально, ОткрытьЗначение, Предупреждение, ВвестиДату, ВвестиЗначение, ВвестиСтроку, ВвестиЧисло): они не работают в веб-клиенте. Используйте асинхронные аналоги (ПоказатьВопрос, ОткрытьФорму, ПоказатьЗначение и т.д.), как в BSL LS.
UsingModalWindowsCheck_Do_not_use_modal_windows = Не используйте модальные окна: используйте асинхронный аналог метода

MissingTempStorageDeletionCheck_title = Отсутствует удаление из временного хранилища
MissingTempStorageDeletionCheck_description = Проверяет, что данные, полученные из временного хранилища (ПолучитьИзВременногоХранилища), впоследствии удаляются (УдалитьИзВременногоХранилища). Без удаления данные остаются в серверной памяти до завершения сеанса. Упрощение: проверка фиксирует все вызовы ПолучитьИзВременногоХранилища метода, если в нём нет ни одного удаления.
MissingTempStorageDeletionCheck_Missing_temp_storage_deletion = Данные временного хранилища не удаляются после использования

UnusedParametersCheck_title = Неиспользуемый параметр метода
UnusedParametersCheck_description = Проверяет, что все параметры метода используются в его теле. Неиспользуемый параметр вводит в заблуждение: вызывающие обязаны его передавать без пользы (как в BSL LS). Проверка не имеет quick fix: удаление параметра меняет сигнатуру и вызовы.
UnusedParametersCheck_Unused_parameter = Параметр «{0}» не используется в теле метода

ApkReuseModuleReturnCheck_title = Бессмысленные методы в общем модуле с повторным использованием
ApkReuseModuleReturnCheck_description = Проверяет общие модули с повторным использованием возвращаемых значений: экспортная процедура бессмысленна, так как процедуры не возвращают значения, а функция из единственного оператора «Возврат <константа>» (строка, число, булево, дата или предопределённый элемент вида Справочники.X.Y) вычисляется быстрее, чем получение из кэша, и занимает память кэша.
ApkReuseModuleReturnCheck_Export_procedure_is_meaningless = Экспортная процедура не имеет смысла в общем модуле с повторным использованием возвращаемых значений: процедуры не возвращают значения
ApkReuseModuleReturnCheck_Function_returns_constant = Функция возвращает константу, вычисление которой быстрее, чем получение из кэша: не следует кэшировать константы примитивных типов и предопределённые элементы

ApkSessionParamInitCheck_title = Инициализацию параметров сеанса следует выполнять в модуле сеанса
ApkSessionParamInitCheck_description = Проверяет, что присваивание значений параметрам сеанса (ПараметрыСеанса.<Имя>) выполняется только в модуле сеанса. Инициализация параметров сеанса в любом другом модуле фиксируется; чтение параметра сеанса допустимо везде.
ApkSessionParamInitCheck_Session_parameter_assignment = Инициализацию параметров сеанса следует выполнять в модуле сеанса
ObsoleteObjectModuleCheck_title = Код в модуле устаревшего объекта метаданных
ObsoleteObjectModuleCheck_description = Проверяет, что все модули устаревшего объекта метаданных пусты. Объект устарел, если его имя (или имя родителя верхнего уровня) начинается с «Удалить»/«Delete»/«Obsolete» без учёта регистра: устаревший объект удаляется вместе со своим кодом, формами и другими ставшими избыточными элементами. Модуль пуст, если не содержит ни одного исполнимого оператора: комментарии и пустые строки допустимы. Каждый непустой модуль помечается одним замечанием.
ObsoleteObjectModuleCheck_Module_has_code = Модуль устаревшего объекта метаданных «{0}» содержит код. Удалите код, формы и другие ставшие избыточными элементы устаревшего объекта

OverridableModuleNonExportMethodCheck_title = Неэкспортный метод в переопределяемом общем модуле
OverridableModuleNonExportMethodCheck_description = Проверяет, что переопределяемый общий модуль (в имени содержится «Переопределяемый»/«Override») не содержит неэкспортных методов: допустимы только экспортные методы, переопределяющие методы библиотеки. Неэкспортный метод переопределяемого модуля не будет вызван механизмом переопределения. Заимствованные общие модули проектов-расширений не проверяются.
OverridableModuleNonExportMethodCheck_Method_is_not_export = Метод «{0}» не является экспортным в переопределяемом общем модуле «{1}». Сделайте метод экспортным или перенесите его из переопределяемого модуля

OverridableModuleNonDeprecatedFunctionCheck_title = Неустаревшая функция в переопределяемом общем модуле
OverridableModuleNonDeprecatedFunctionCheck_description = Проверяет, что переопределяемый общий модуль (в имени содержится «Переопределяемый»/«Override») не содержит функций, кроме устаревших, оставленных для обратной совместимости: функция переопределяемого модуля не будет вызвана механизмом переопределения. Функция считается устаревшей, если помечена комментарием «Устарела.»/«Deprecated.» либо размещена в области «УстаревшиеПроцедурыИФункции»/«Deprecated». Заимствованные общие модули проектов-расширений не проверяются.
OverridableModuleNonDeprecatedFunctionCheck_Function_is_not_deprecated = Функция «{0}» не является устаревшей в переопределяемом общем модуле «{1}». Замените функцию процедурой или пометьте её устаревшей

OverridableModuleTopRegionCheck_title = Внешняя область, кроме «ПрограммныйИнтерфейс», в переопределяемом общем модуле
OverridableModuleTopRegionCheck_description = Проверяет, что переопределяемый общий модуль (в имени содержится «Переопределяемый»/«Override») не содержит внешних (верхнеуровневых) областей, кроме «ПрограммныйИнтерфейс»/«Public»: весь переопределяемый модуль размещается в области «ПрограммныйИнтерфейс»/«Public». Вложенные области (внутри других областей) допустимы. Заимствованные общие модули проектов-расширений не проверяются.
OverridableModuleTopRegionCheck_Region_is_not_allowed = Внешняя область «{0}» не допускается в переопределяемом общем модуле «{1}». Используйте только область «ПрограммныйИнтерфейс»/«Public»
TypeByMetadataNameCheck_title = Тип значения переменной следует определять сравнением с типом, а не по имени метаданных
TypeByMetadataNameCheck_description = Проверяет, что тип значения переменной определяется сравнением типа значения с типом, например ТипЗнч(Ссылка) = Тип("ДокументСсылка.ПоступлениеТоваровУслуг"), а не сравнением имени (полного имени) метаданных со строкой. Определение типа по имени метаданных ненадёжно и может приводить к ошибкам. Перенос проверки АПК АПК_00305 (статья 442 стандарта).
TypeByMetadataNameCheck_Type_determined_by_metadata_name = Не определяйте тип значения по имени метаданных, сравните тип значения с типом: ТипЗнч(Значение) = Тип("...")
UsingSynchronousCallsCheck_title = Использование синхронных вызовов
UsingSynchronousCallsCheck_description = Проверяет использование синхронных методов глобального контекста (Вопрос, ОткрытьФормуМодально, Предупреждение, ПоместитьФайл, НайтиФайлы, ЗапуститьПриложение и др.) в клиентских модулях, когда конфигурация ограничивает синхронные вызовы: они не работают в веб-клиенте. Используйте асинхронные аналоги (ПоказатьВопрос, ОткрытьФорму, НачатьПомещениеФайла и т.д.). Вызовы в методах с директивами компиляции &НаСервере и &НаСервереБезКонтекста не проверяются, как и строго серверные модули.
UsingSynchronousCallsCheck_message = Вместо синхронного метода `{0}` необходимо использовать `{1}`
ApkCutCommentsFormatCheck_title = Оформление вырезаемых служебных комментариев
ApkCutCommentsFormatCheck_description = Проверяет оформление вырезаемых служебных комментариев («// Локализация», «// Конец Локализация», «// _Демо начало примера», «// _Демо конец примера»), которыми обрамляют фрагменты кода, вырезаемые при сборке международной поставки: неверный формат или регистр комментария, запрещённые комментарии в модулях без постфикса «Локализация», отсутствие пары комментариев в общем модуле с постфиксом, несбалансированные открывающие/закрывающие комментарии. Перенос проверки АПК_01219 (статья 769 стандарта).
ApkCutCommentsFormatCheck_Wrong_comment_format = Формат служебного комментария указан неверно (ожидалось «// Локализация», «// Конец Локализация» и т.д.)
ApkCutCommentsFormatCheck_Comment_not_allowed = В модуле без постфикса «Локализация» присутствует служебный комментарий «// Локализация»
ApkCutCommentsFormatCheck_Localization_module_missing_comment = В модуле с постфиксом «Локализация» отсутствует обязательный служебный комментарий «// Локализация» или «// Конец Локализация»
ApkCutCommentsFormatCheck_Missing_pair = Отсутствует парный открывающий или закрывающий служебный комментарий (например, найден «// Локализация», но не найден «// Конец Локализация»)

ApkStringConcatInLoopCheck_title = Массовая конкатенация строк в цикле
ApkStringConcatInLoopCheck_description = Проверяет, что строковая переменная не аккумулируется в цикле через конкатенацию (Переменная = Переменная + ...). При массовых операциях используйте СтрСоединить() и СтрРазделить(): это быстрее и экономнее по памяти. Одно замечание на цикл; числовые счётчики (Счетчик = Счетчик + 1) не помечаются. Статическое приближение проверки АПК_01171 (статья 782 стандарта): исходное правило считает конкатенации в рантайме (порог 1000).
ApkStringConcatInLoopCheck_String_concatenation_in_loop = Строки аккумулируются в цикле через конкатенацию: при массовых операциях используйте СтрСоединить() и СтрРазделить()
ApkScheduledJobsManagerCheck_title = Обращение в программном коде к менеджеру регламентных заданий
ApkScheduledJobsManagerCheck_description = Проверяет прямое обращение к менеджеру регламентных заданий («РегламентныеЗадания») — начало цепочки обращения с этим именем. Для управления заданиями используйте программный интерфейс БСП из модуля «РегламентныеЗаданияСервер» (стандарт 760, п. 3). Общие модули с именем, начинающимся на «РегламентныеЗадания», не проверяются. Проверка выключена по умолчанию: предусловие АПК «в решении есть подсистема ТехнологияСервиса/БСП» статически не воспроизводится.
ApkScheduledJobsManagerCheck_Direct_manager_access = Не используйте прямое обращение к менеджеру регламентных заданий «{0}»: используйте программный интерфейс БСП «РегламентныеЗаданияСервер»

ApkFileGlobalMethodsCheck_title = Использование методов глобального контекста для работы с файлами
ApkFileGlobalMethodsCheck_description = Проверяет использование методов глобального контекста для работы с файлами (ПоместитьФайл, НачатьПомещениеФайла, ПоместитьФайлы, НачатьПомещениеФайлов, ПолучитьФайл, ПолучитьФайлы, НачатьПолучениеФайлов) и вызов «Показать» у переменной, которой присвоен «Новый ДиалогВыбораФайла». В решениях на БСП используйте вместо них программный интерфейс «ФайловаяСистемаКлиент» (ЗагрузитьФайл, СохранитьФайлы, ВыбратьКаталог и т.д.). Отслеживание диалога — на один уровень (переменная, присвоенная в том же методе), как в АПК. Общие модули «ФайловаяСистемаКлиент» и «ФайловаяСистемаСлужебныйКлиент» не проверяются. Проверка выключена по умолчанию: предусловие АПК «в решении есть подсистема ТехнологияСервиса/БСП» статически не воспроизводится.
ApkFileGlobalMethodsCheck_Global_file_method = Вместо глобального метода «{0}» используйте программный интерфейс БСП «ФайловаяСистемаКлиент»
ApkFileGlobalMethodsCheck_File_dialog_show = Вместо модального вызова «ДиалогВыбораФайла.Показать» используйте программный интерфейс БСП «ФайловаяСистемаКлиент»

ApkRegistrarAccessCheck_title = Самодостаточность регистров: обращение к реквизиту «Регистратор»
ApkRegistrarAccessCheck_description = Проверяет, что в модуле набора записей регистра нет обращений к реквизиту «Регистратор» (Recorder) через точку. Разыменование регистратора нарушает самодостаточность регистра: логика по данным регистра и отчёты должны опираться только на данные самого регистра. Обращение к полям регистратора через точку приводит к неявным соединениям с дополнительными таблицами, а в распределённой информационной базе регистратора может не быть: движения мигрируют между узлами, регистраторы — нет. Допустимые обращения (по алгоритму АПК): «Отбор.Регистратор», «СтандартныеРеквизиты.Регистратор», «Регистратор.ТипЗначения», «Регистратор.Метаданные()», «Регистратор.ПолучитьОбъект()», «Регистратор.МоментВремени()». Поиск выполняется по тексту модуля, включая комментарии и строковые литералы с текстами запросов. Перенос проверки АПК АПК_00150 (статья 477 стандарта).
ApkRegistrarAccessCheck_Registrar_access_breaks_self_sufficiency = Обращение к реквизиту «Регистратор» (Recorder) через точку в модуле набора записей нарушает самодостаточность регистра (строка {0})
ApkNoYouPronounCheck_title = В сообщениях не употребляются местоимения «Вы», «Вас» и пр.
ApkNoYouPronounCheck_description = Проверяет, что тексты сообщений для пользователя (строковые литералы) не содержат местоимений «Вы», «Вас», «Вам», «Вами», «Ваш»: сообщения составляются в форме безличного предложения. Фиксируются только цельные слова; «Вашего», «Выполнить» или «Василий» не помечаются. Комментарии не проверяются. Одно замечание на строку вхождения. Перенос проверки АПК АПК_00714 (статья 585 стандарта).
ApkNoYouPronounCheck_Message_addresses_user_with_pronoun = Сообщение обращается к пользователю через местоимение «{0}» (модуль {1}, строка {2}): составьте сообщение в форме безличного предложения

ApkNoExclamationMarkCheck_title = Сообщения не должны содержать восклицательных знаков
ApkNoExclamationMarkCheck_description = Проверяет, что тексты сообщений для пользователя (строковые литералы) не содержат восклицательных знаков: они звучат приказом и заставляют пользователя чувствовать себя виноватым. Исключения (не помечаются): слово «Внимание!» (англ. «Attention!»), знак перед оператором или xsl-кодом («!=» и пр.), параметры bat-файлов (!args!, !setup.exe!, !directory!), а также знак, перед которым не буква, не цифра и не «()» вызова метода. Комментарии не проверяются. Одно замечание на строку вхождения. Перенос проверки АПК АПК_00715 (статья 585 стандарта).
ApkNoExclamationMarkCheck_Message_contains_exclamation_mark = Сообщение содержит восклицательный знак (модуль {0}, строка {1}): уберите его или оставьте только в предупреждениях об опасных действиях («Внимание!»)

ApkLinuxUnsupportedCheck_title = Методы и объекты, не поддерживаемые ОС Linux
ApkLinuxUnsupportedCheck_description = Проверяет, что в коде не используются методы и объекты, не поддерживаемые в ОС Linux: методы подключения внешних компонент (ЗагрузитьВнешнююКомпоненту/LoadAddIn, ПодключитьВнешнююКомпоненту/AttachAddIn, ПодключитьВнешнююКомпонентуАсинх/AttachAddInAsync, НачатьПодключениеВнешнейКомпоненты/BeginAttachingAddIn), COM-вариант перечисления ТипВнешнейКомпоненты/AddInType, объекты COMОбъект/COMObject, Почта/Mail и ИзвлечениеТекста/TextExtraction, а также методы файлов и клиента УстановитьНевидимость/SetHidden, УстановитьНевидимостьАсинх/SetHiddenAsync, ПолучитьОтображениеЗаголовкаОС/GetOSCaptionRepresentation, УстановитьОтображениеЗаголовкаОС/SetOSCaptionRepresentation. Поиск выполняется по полному тексту модуля, включая комментарии и строковые литералы (как в алгоритме АПК); замечание ставится на каждое вхождение. Предусловие АПК «правило выполняется только в ОС Linux» не воспроизводится статически, поэтому проверка по умолчанию выключена (аудит). Перенос проверки АПК АПК_01364 (статья 723 стандарта).
ApkLinuxUnsupportedCheck_Unsupported_construct = Метод или объект «{0}» не поддерживается в ОС Linux (строка {1}); используйте кроссплатформенные механизмы

ApkPathSeparatorMaskCheck_title = Разделитель пути и маска всех файлов указаны вручную
ApkPathSeparatorMaskCheck_description = Проверяет, что в литеральных строковых параметрах методов поиска файлов разделитель пути («\», «/») и маска всех файлов («*.*») не указываются вручную: НайтиФайлы/FindFiles — параметры 1 и 2, НачатьПоискФайлов/BeginFindingFiles — параметры 2 и 3, конструктор Новый Файл/New File — параметр 1. Используйте функции ПолучитьРазделительПути (GetPathSeparator) и ПолучитьМаскуВсеФайлы (GetAllFilesMask): разделители и маски различаются в ОС Windows и Linux. В решениях на БСП используйте функции общих модулей ОбщегоНазначения и ОбщегоНазначенияКлиент. Параметры-переменные и выражения не проверяются. Перенос проверки АПК АПК_01167 (статья 723 стандарта, п. 2.5.2).
ApkPathSeparatorMaskCheck_Manual_path_separator = Не указывайте разделитель пути вручную: используйте функцию ПолучитьРазделительПути (GetPathSeparator)
ApkPathSeparatorMaskCheck_Manual_all_files_mask = Не указывайте маску всех файлов «*.*» вручную: используйте функцию ПолучитьМаскуВсеФайлы (GetAllFilesMask)
ApkMainLanguageCodeCheck_title = Код основного языка получается через Метаданные.ОсновнойЯзык
ApkMainLanguageCodeCheck_description = При использовании в конфигурации Библиотеки стандартных подсистем (БСП) код основного языка следует получать функцией КодОсновногоЯзыка общего модуля ОбщегоНазначения, а не обращением Метаданные.ОсновнойЯзык (Метаданные.ОсновнойЯзыК.КодЯзыка). Единственное допустимое место — функция КодОсновногоЯзыка самого модуля ОбщегоНазначения. Перенос проверки АПК АПК_01205.
ApkMainLanguageCodeCheck_Use_MainLanguageCode_function = Для получения кода основного языка используйте функцию КодОсновногоЯзыка общего модуля ОбщегоНазначения, а не обращение Метаданные.ОсновнойЯзык

ApkUpdateHandlerVersionFormatCheck_title = Неверный формат версии в обработчике обновления ИБ
ApkUpdateHandlerVersionFormatCheck_description = Проверяет, что версия, назначаемая обработчику в процедуре ПриДобавленииОбработчиковОбновления (Обработчик.Версия = "..."), — это «*» либо номер версии в формате «Р.П.В.С» или «Р.П.В»: не менее трёх сегментов, разделённых точками, каждый сегмент — только цифры. Пустая версия не помечается (по стандарту она должна сопровождаться свойством НачальноеЗаполнение = Истина, что вне рамок проверки). Перенос проверки АПК АПК_01190 (статья 690 стандарта).
ApkUpdateHandlerVersionFormatCheck_Invalid_version_format = Версия обработчика обновления указывается как «*» либо номером в формате «Р.П.В.С» или «Р.П.В»: не менее трёх сегментов через точку, только цифры
ApkConstantWriteInTransactionCheck_title = Запись константы выполняется в транзакции

ApkConstantWriteInTransactionCheck_description = Проверяет, что запись констант (Константы.<Имя>.Установить(...)/Записать(...), англ. Constants.<Name>.Set/Write) выполняется вне транзакций: на время записи значения константы работа других сеансов, записывающих ту же константу, приостанавливается, поэтому запись в транзакции становится «узким» местом при конкурентной работе. Вызов помечается, если он лексически расположен в том же методе между вызовами «НачатьТранзакцию» и «ЗафиксироватьТранзакцию» — по позициям операторов, без разворачивания вложенности Если/Циклов. Транзакция, открытая в другом методе, не отслеживается; чтение констант и запись других объектов не помечаются. Правило АПК_00157 (упрощённо: п. 2 алгоритма АПК — обход блокировки констант тотальным кешированием — не проверяется).

ApkConstantWriteInTransactionCheck_Constant_write_in_transaction = Константа записывается в транзакции: выполняйте запись констант вне транзакций — на время записи параллельные сеансы, записывающие ту же константу, приостанавливаются
OverridableModuleRedundantCodeCheck_title = Лишний код в процедуре переопределяемого общего модуля
OverridableModuleRedundantCodeCheck_description = Проверяет, что процедура переопределяемого общего модуля (в имени содержится «Переопределяемый»/«Override»), переопределяющая метод с тем же именем другого общего модуля, состоит только из вызовов переопределяемого метода: каждый оператор имеет вид «<ИмяМодуля>.<ИмяПроцедуры>(...)». Присваивания, условия, циклы и локальные вызовы — лишний код: переопределяемая процедура должна сводиться к вызову оригинала. Распознаются формы вызова: «Модуль.Метод(...)», «ОбщегоНазначения.ОбщийМодуль("Модуль").Метод(...)» и вызов через переменную, которой присвоен «ОбщегоНазначения.ОбщийМодуль("Модуль")» (сам оператор присваивания считается лишним кодом, как в АПК). Код между комментариями «// _Демо начало примера» и «// _Демо конец примера» не проверяется. Одно замечание на процедуру — по первому лишнему оператору. Выключена по умолчанию: включайте для конфигураций, развиваемых поверх иерархии библиотек.
OverridableModuleRedundantCodeCheck_Redundant_code = Лишний код в переопределяемой процедуре «{0}» общего модуля «{1}»: «{2}». Процедура должна сводиться к вызову переопределяемого метода: Модуль.Метод(...)

OverridableModuleProcedureNameCheck_title = Имя вызываемого метода не совпадает с именем переопределяемой процедуры
OverridableModuleProcedureNameCheck_description = Проверяет, что процедура переопределяемого общего модуля (в имени содержится «Переопределяемый»/«Override»), имеющая парный метод с тем же именем в другом общем модуле, вызывает именно парный метод: имя вызываемого метода совпадает с именем переопределяемой процедуры. Вызов метода с другим именем общего модуля помечается отдельным замечанием. Распознаются формы вызова: «Модуль.Метод(...)», «ОбщегоНазначения.ОбщийМодуль("Модуль").Метод(...)» и вызов через переменную, которой присвоен «ОбщегоНазначения.ОбщийМодуль("Модуль")». Код между комментариями «// _Демо начало примера» и «// _Демо конец примера» не проверяется. Выключена по умолчанию: включайте для конфигураций, развиваемых поверх иерархии библиотек.
OverridableModuleProcedureNameCheck_Method_name_does_not_match = Переопределяемая процедура «{1}» общего модуля «{2}» вызывает метод «{0}»: имя вызываемого метода должно совпадать с именем переопределяемой процедуры

OverridableModuleParametersCheck_title = Параметры вызываемого метода не совпадают с параметрами переопределяемой процедуры
OverridableModuleParametersCheck_description = Проверяет, что вызов переопределяемого метода из процедуры переопределяемого общего модуля (в имени содержится «Переопределяемый»/«Override») передаёт все параметры переопределяемой процедуры в том же порядке: сравниваются имена и количество параметров по позициям (типы в 1С не декларируются). Каждый вызов с несовпадающим количеством, порядком или именами параметров помечается отдельным замечанием. Распознаются формы вызова: «Модуль.Метод(...)», «ОбщегоНазначения.ОбщийМодуль("Модуль").Метод(...)» и вызов через переменную, которой присвоен «ОбщегоНазначения.ОбщийМодуль("Модуль")». Код между комментариями «// _Демо начало примера» и «// _Демо конец примера» не проверяется. Выключена по умолчанию: включайте для конфигураций, развиваемых поверх иерархии библиотек.
OverridableModuleParametersCheck_Parameters_count_does_not_match = Вызов переопределяемой процедуры «{2}» передаёт {0} параметров, а процедура объявляет {1}: передавайте все параметры переопределяемой процедуры в том же порядке
OverridableModuleParametersCheck_Parameters_order_does_not_match = Параметр вызова {0} «{1}» не соответствует параметру «{2}» переопределяемой процедуры «{3}»: передавайте все параметры переопределяемой процедуры в том же порядке

OverridableModuleSeeCommentCheck_title = У вызываемого метода нет комментария «См. Модуль.Процедура»
OverridableModuleSeeCommentCheck_description = Проверяет, что у метода общего модуля библиотеки, вызываемого из переопределяемой процедуры переопределяемого общего модуля (в имени содержится «Переопределяемый»/«Override»), есть комментарий-отсылка «См. <ПереопределяемыйМодуль>.<Процедура>.» над объявлением (между комментарием и объявлением допускаются пустые строки). После нормализации комментария (без «/», пробелов и переводов строк) текст должен начинаться с «См.<Модуль>.<Метод>»; регистр «См.» и имён значим, как в алгоритме АПК. Замечание регистрируется на переопределяемой процедуре (в АПК — на вызываемом модуле). Распознаются формы вызова: «Модуль.Метод(...)», «ОбщегоНазначения.ОбщийМодуль("Модуль").Метод(...)» и вызов через переменную, которой присвоен «ОбщегоНазначения.ОбщийМодуль("Модуль")». Выключена по умолчанию: включайте для конфигураций, развиваемых поверх иерархии библиотек.
OverridableModuleSeeCommentCheck_Missing_see_comment = У вызываемого метода «{0}.{1}» нет комментария-отсылки «См. {2}.{3}.» над объявлением: добавьте комментарий к вызываемому методу

LockWithoutLockCall_title = Блокировка данных создана, но не заблокирована
LockWithoutLockCall_description = Проверяет, что блокировка данных, созданная оператором «Новый БлокировкаДанных» и заполненная элементами через метод «Добавить()», где-то в том же методе блокируется вызовом метода «Заблокировать()». Созданная, но ни разу не заблокированная блокировка не защищает данные от конкурентного изменения. Отслеживание лексическое, в пределах одного метода: если блокировка передана в другой метод, который её блокирует, замечание всё равно выдаётся. Требование вызывать «Заблокировать()» в попытке проверяется отдельной проверкой «Метод Заблокировать() вне блока Попытка-Исключение».
LockWithoutLockCall_Lock_method_is_not_called = После инициализации блокировки данных отсутствует вызов метода «Заблокировать()»
FormModuleParametersParameterCheck_title = Параметр метода модуля формы имеет имя «Параметры»
FormModuleParametersParameterCheck_description = Проверяет, что метод модуля формы не имеет параметра с именем «Параметры» (или англ. «Parameters», без учёта регистра). В модуле формы доступ к параметрам формы выполняется через свойство «Параметры», поэтому параметр метода с таким именем перекрывает его и может привести к неявным ошибкам. Каждый такой параметр помечается замечанием.
FormModuleParametersParameterCheck_Parameter_named_Parameters = Параметр метода «{0}» конфликтует со свойством формы «Параметры»: переименуйте параметр

ObjectModuleParameterMatchesAttributeCheck_title = Имя параметра метода модуля объекта совпадает с именем реквизита или табличной части объекта
ObjectModuleParameterMatchesAttributeCheck_description = Проверяет, что метод модуля объекта (справочника, документа и т.п.) не имеет параметра, имя которого (без учёта регистра) совпадает с именем реквизита или табличной части того же объекта. Такое имя перекрывает член объекта и может привести к неявному поведению или ошибке при выполнении. Сравниваются только прикладные реквизиты и имена табличных частей верхнего уровня: реквизиты табличных частей и стандартные реквизиты (Код, Наименование, ЭтотОбъект и т.п.) не сравниваются. Каждый совпавший параметр помечается замечанием.
ObjectModuleParameterMatchesAttributeCheck_Parameter_matches_attribute = Имя параметра метода «{0}» совпадает с именем реквизита или табличной части объекта: переименуйте параметр
NstrSyntaxCheck_title = Синтаксис локализованной строки функции НСтр
NstrSyntaxCheck_description = Проверяет, что строковый литерал в вызове функции НСтр (NStr) соответствует синтаксису локализованной строки: одна или несколько записей вида «код языка (2–5 букв с необязательным регионарным суффиксом), знак равенства, текст сообщения в одинарных кавычках», разделённых запятыми; одинарные кавычки внутри текста сообщения удваиваются. Например: НСтр("ru='Текст сообщения'"). Помечаются: значение в двойных кавычках или без кавычек, отсутствие кода языка, незакрытый текст сообщения, разделитель без следующей записи. Первый параметр — не строковый литерал (включая вложенный вызов НСтр) — помечается проверкой bsl-nstr-string-literal-format. Стандарт 761.
NstrSyntaxCheck_String_does_not_match_pattern = Нарушен синтаксис описания локализованной строки: используйте одну или несколько записей вида «код языка, знак равенства, текст сообщения в одинарных кавычках», разделённых запятыми, и удваивайте одинарные кавычки внутри текста, например: НСтр("ru='Текст сообщения'")
