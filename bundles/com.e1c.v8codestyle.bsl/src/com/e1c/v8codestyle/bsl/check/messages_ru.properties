EmptyCodeBlockCheck_title = Пустой блок кода
EmptyCodeBlockCheck_description = Проверяет, что блоки кода условий и циклов не пусты. Пустой блок — признак забытой реализации или удалённого содержимого. Не проверяются тела методов, блоки «Исключение» и файловый блок модуля. Параметр «Считать комментарии кодом» (по умолчанию выключен): блок, содержащий комментарии, пустым не считается. Перенос диагностики BSL Language Server EmptyCodeBlock.
