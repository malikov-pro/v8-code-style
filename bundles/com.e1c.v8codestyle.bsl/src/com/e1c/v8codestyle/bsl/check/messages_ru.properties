EmptyCodeBlockCheck_If_condition = условия «Если»
EmptyCodeBlockCheck_ElsIf_condition = условия «ИначеЕсли»
EmptyCodeBlockCheck_Else_section = секции «Иначе»
EmptyCodeBlockCheck_Loop_body = тело цикла
EmptyCodeBlockCheck_Treat_comments_as_code = Считать комментарии кодом
DeletingCollectionItemCheck_title = Удаление элемента при обходе коллекции
DeletingCollectionItemCheck_description = Проверяет, что элементы коллекции не удаляются при её обходе оператором «Для каждого … Из … Цикл»: при удалении элемента сдвигается индекс следующего, часть элементов будет пропущена. Перенос диагностики BSL Language Server DeletingCollectionItem.
DeletingCollectionItemCheck_Do_not_delete_collection_items_while_iterating = Не следует удалять элементы коллекции {0} при её обходе оператором «Для каждого … Из … Цикл»
SelfInsertionCheck_title = Вставка коллекции в саму себя
SelfInsertionCheck_description = Проверяет, что коллекция не вставляется (добавляется) в саму себя: вставка коллекции в саму себя приводит к возникновению циклических ссылок. Перенос диагностики BSL Language Server SelfInsertion.
SelfInsertionCheck_Remove_self_insertion = Удалите вставку коллекции в саму себя
IfElseDuplicatedConditionCheck_title = Повторяющееся условие в операторе «Если»
IfElseDuplicatedConditionCheck_description = Проверяет, что условия оператора «Если … Тогда … ИначеЕсли» не повторяются: повторное условие никогда не будет проверено, его ветка недостижима. Перенос диагностики BSL Language Server IfElseDuplicatedCondition.
IfElseDuplicatedConditionCheck_Duplicate_condition_of_If_statement = Повторяющееся условие оператора «Если»: {0}
MethodSizeCheck_title = Размер метода
MethodSizeCheck_description = Проверяет, что размер метода (число строк его тела) не превышает заданный максимум (по умолчанию 200 строк). Большой метод сложен для восприятия и сопровождения. Перенос диагностики BSL Language Server MethodSize.
MethodSizeCheck_Method_is_too_large = Метод {0} слишком большой: {1} строк (максимум {2})
MethodSizeCheck_Maximum_method_size = Максимальный размер метода (в строках)
LineLengthCheck_title = Длина строки
LineLengthCheck_description = Проверяет, что строки модуля не длиннее заданного максимума (по умолчанию 120 символов). Упрощённый перенос диагностики BSL Language Server LineLength.
LineLengthCheck_Line_is_too_long = Строка {0} слишком длинная: {1} символов (максимум {2})
LineLengthCheck_Maximum_line_length = Максимальная длина строки (в символах)
FunctionShouldHaveReturnCheck_title = Функция должна содержать возврат
FunctionShouldHaveReturnCheck_description = Проверяет, что функция содержит хотя бы один оператор «Возврат». Функция без «Возврат» неявно возвращает «Неопределено», что обычно является ошибкой: такой метод должен вернуть значение либо быть переписан в процедуру. Платформа 1С этот случай не диагностирует. Перенос диагностики BSL Language Server FunctionShouldHaveReturn.
FunctionShouldHaveReturnCheck_Function_has_no_Return_statement = Функция {0} не содержит оператора «Возврат»
ApkFrenchQuotesCheck_title = Французские кавычки «ёлочки» не допускаются в интерфейсных текстах
ApkFrenchQuotesCheck_description = Проверяет, что французские кавычки «ёлочки» не используются в интерфейсных текстах (строковых литералах функции НСтр); следует использовать прямые кавычки. Кавычки вне НСтр, в том числе в текстах справки, допустимы. Перенос проверки АПК АПК_01194 (статья 598 стандарта).
ApkFrenchQuotesCheck_French_quotes_are_not_allowed_in_interface_text = Французская кавычка {0} или {1} не допускается в интерфейсном тексте, используйте прямые кавычки
ApkMetadataViaObjectCheck_title = Метаданные объекта получаются через свойство глобального контекста Метаданные
ApkMetadataViaObjectCheck_description = Проверяет, что метаданные объекта получаются методом Метаданные() самого объекта, а не обращением к свойству глобального контекста Метаданные (Метаданные.Справочники[Имя], Метаданные.Документы.НайтиПоКоду(...) и т.п.) — второй способ существенно медленнее. Исключение — метод НайтиПоТипу для случаев, когда тип объекта метаданных заранее неизвестен. Перенос проверки АПК АПК_00306 (статья 445 стандарта).
ApkMetadataViaObjectCheck_Use_object_Metadata_method = Для получения метаданных объекта используйте метод Метаданные() этого объекта, а не свойство глобального контекста Метаданные
ApkQueryEmptyResultCheck_title = Пустота результата запроса проверяется выборкой вместо метода Пустой
ApkQueryEmptyResultCheck_description = Проверяет, что отсутствие строк в результате запроса проверяется методом Пустой(), а не получением выборки (Запрос.Выполнить().Выбрать()) с анализом в условии — на получение выборки затрачивается дополнительное время. Перенос проверки АПК АПК_00205 (статья 438 стандарта).
ApkQueryEmptyResultCheck_Use_query_result_Empty_method = Для проверки отсутствия строк в результате запроса используйте метод Пустой(), а не перебор выборки в условии
ApkPostingsWriteOrderCheck_title = Явная запись движений документа в обработчике проведения
ApkPostingsWriteOrderCheck_description = Проверяет, что в обработчике проведения документа (ОбработкаПроведения) нет явной записи наборов записей регистров методом Записать. Запись движений должна выполняться системой неявно при завершении процедуры проведения; явная запись при параллельной работе нескольких пользователей может приводить к взаимным блокировкам. Отслеживается и запись через локальную переменную, которой присвоена коллекция движений, включая цепочки псевдонимов. Перенос проверки АПК АПК_00334 (статья 450 стандарта).
ApkPostingsWriteOrderCheck_Explicit_postings_write = Не следует явно записывать наборы записей регистров (метод Записать) в обработчике проведения; запись движений выполнит система при завершении процедуры проведения
ApkYoLetterCheck_title = Буква «ё» не допускается в текстах модулей
ApkYoLetterCheck_description = Проверяет, что буква «ё» не используется в текстах модулей: в коде, строковых литералах и комментариях. Каждое вхождение помечается отдельным замечанием. Перенос проверки АПК АПК_00260 (статья 598 стандарта).
ApkYoLetterCheck_Yo_letter_is_not_allowed_in_module_text = Буква {0} не допускается в тексте модуля: {1}, строка {2}
ApkZeroDocumentFieldsCheck_title = Нулевые поля табличного документа
ApkZeroDocumentFieldsCheck_description = Проверяет, что в коде не устанавливаются нулевые поля табличного документа: свойствам полей ПолеСлева/ПолеСправа/ПолеСверху/ПолеСнизу (LeftMargin/RightMargin/TopMargin/BottomMargin) не присваивается 0 — при печати с нулевыми полями содержимое документа обрезается. Поиск выполняется по полному тексту модуля, включая комментарии и строковые литералы, без учёта регистра, по русским и английским именам свойств; каждое вхождение помечается отдельным замечанием. В отличие от точного поиска подстроки в алгоритме АПК допускаются пробелы вокруг знака присваивания; как и в алгоритме АПК, присваивание не отличимо от сравнения. Перенос проверки АПК АПК_00576 (статья 548 стандарта, формирование печатных форм).
ApkZeroDocumentFieldsCheck_Zero_document_field = У табличного документа установлено нулевое поле: «{0}» (строка {1}); при печати содержимое может обрезаться, задайте достаточные поля
ApkSumInQueryCheck_title = Функция СУММА() с числовым операндом в запросах в текстах модулей
ApkSumInQueryCheck_description = Проверяет, что тексты запросов в модулях не содержат вызова функции СУММА() с константным числовым операндом для подсчёта количества записей: при 10 млн записей и более произойдёт переполнение из-за разрядности числа по умолчанию. Следует использовать функцию КОЛИЧЕСТВО. Перенос проверки АПК АПК_01192 (статья 787 стандарта).
ApkSumInQueryCheck_Sum_with_constant_operand_in_query = В тексте запроса использована функция {0}: для подсчёта количества записей используйте КОЛИЧЕСТВО вместо СУММА — при 10 млн записей и более произойдёт переполнение ({1}, строка {2})
ApkQueryFieldAliasCheck_title = Псевдоним в тексте запроса совпадает с именем класса объектов метаданных
ApkQueryFieldAliasCheck_description = Проверяет, что псевдонимы в текстах запросов в модулях (после ключевых слов КАК/AS) не называются именами классов объектов метаданных («Справочник», «Документ», Catalog, Document и т.п.); псевдонимы источников и полей должны быть осмысленными и образовываться от терминов предметной области, как имена переменных. Перенос проверки АПК АПК_01216 (статья 758 стандарта).
ApkQueryFieldAliasCheck_Alias_matches_metadata_class_name = Псевдоним {0} в тексте запроса совпадает с именем класса объектов метаданных; используйте осмысленный псевдоним ({1}, строка {2})

