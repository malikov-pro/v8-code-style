DeletingCollectionItemCheck_title = Deleting collection item while iterating
DeletingCollectionItemCheck_description = Checks that items of a collection are not deleted while the collection is iterated with the "For Each ... In ... Do" loop: deleting an item shifts the index of the next one, so some items will be skipped. Ported from the BSL Language Server diagnostic DeletingCollectionItem.
DeletingCollectionItemCheck_Do_not_delete_collection_items_while_iterating = Do not delete items of the collection {0} while iterating it with the "For Each ... In ... Do" loop
SelfInsertionCheck_title = Inserting a collection into itself
SelfInsertionCheck_description = Checks that a collection is not inserted (added) into itself: inserting a collection into itself leads to circular references. Ported from the BSL Language Server diagnostic SelfInsertion.
SelfInsertionCheck_Remove_self_insertion = Remove the insertion of the collection into itself
IfElseDuplicatedConditionCheck_title = Duplicate condition in "If" statement
IfElseDuplicatedConditionCheck_description = Checks that conditions of "If ... Then ... ElsIf" statement are not duplicated: a duplicated condition is never checked, its branch is unreachable. Ported from the BSL Language Server diagnostic IfElseDuplicatedCondition.
IfElseDuplicatedConditionCheck_Duplicate_condition_of_If_statement = Duplicate condition of the "If" statement: {0}
MethodSizeCheck_title = Method size
MethodSizeCheck_description = Checks that the method size (the number of lines of its body) does not exceed the configured maximum (200 lines by default). A large method is hard to understand and maintain. Ported from the BSL Language Server diagnostic MethodSize.
MethodSizeCheck_Method_is_too_large = Method "{0}" is too large: {1} lines (maximum {2})
MethodSizeCheck_Maximum_method_size = Maximum method size (in lines)
LineLengthCheck_title = Line length
LineLengthCheck_description = Checks that module lines are not longer than the configured maximum (120 characters by default). Ported from the BSL Language Server diagnostic LineLength (simplified).
LineLengthCheck_Line_is_too_long = Line {0} is too long: {1} characters (maximum {2})
LineLengthCheck_Maximum_line_length = Maximum line length (in characters)
FunctionShouldHaveReturnCheck_title = Function should have return
FunctionShouldHaveReturnCheck_description = Checks that a function contains at least one "Return" statement. A function without "Return" implicitly returns Undefined, which is usually a bug: such method should either return a value or be rewritten as a procedure. Ported from the BSL Language Server diagnostic FunctionShouldHaveReturn.
FunctionShouldHaveReturnCheck_Function_has_no_Return_statement = Function "{0}" has no "Return" statement
ApkFrenchQuotesCheck_title = French quotes are not allowed in interface texts
ApkFrenchQuotesCheck_description = Checks that French quotes (guillemets) are not used in interface texts (NStr function string literals); straight quotes should be used instead. Quotes outside NStr, including help texts, are allowed. Ported from the APK check АПК_01194 (standard 598).
ApkFrenchQuotesCheck_French_quotes_are_not_allowed_in_interface_text = French quote {0} or {1} is not allowed in interface text, use straight quotes instead
ApkMetadataViaObjectCheck_title = Object metadata is obtained via the global context property Metadata
ApkMetadataViaObjectCheck_description = Checks that object metadata is obtained by calling the Metadata() method of the object rather than by accessing the Metadata global context property (Metadata.Catalogs[Name], Metadata.Documents.FindByCode(...), etc.), which is significantly slower. The FindByType method is allowed when the metadata object type is unknown in advance. Ported from the APK check АПК_00306 (standard 445).
ApkMetadataViaObjectCheck_Use_object_Metadata_method = Get object metadata with the Metadata() method of the object instead of the global context property Metadata
ApkQueryEmptyResultCheck_title = Query result emptiness is checked via the selection instead of the Empty method
ApkQueryEmptyResultCheck_description = Checks that the absence of rows in a query result is checked with the Empty() method instead of fetching a selection (Query.Execute().Select()) and testing it in a condition; fetching the selection takes extra time. Ported from the APK check АПК_00205 (standard 438).
ApkQueryEmptyResultCheck_Use_query_result_Empty_method = Use the Empty() method of the query result instead of iterating the selection in a condition
ApkPostingsWriteOrderCheck_title = Explicit writing of document postings in Posting handler
ApkPostingsWriteOrderCheck_description = Checks that register record sets are not written explicitly (Write method) in the document posting handler (ОбработкаПроведения). Postings should be written by the system implicitly when the posting handler completes; an explicit write may cause record deadlocks when several users post documents in parallel. Writing through a local variable assigned from the postings collection, including alias chains, is tracked as well. Ported from the APK check АПК_00334 (standard 450).
ApkPostingsWriteOrderCheck_Explicit_postings_write = Register record sets should not be written explicitly (Write method) in the posting handler; let the system write postings when the handler completes
ApkYoLetterCheck_title = Letter "Yo" (ё) is not allowed in module texts
ApkYoLetterCheck_description = Checks that the letter "yo" (ё) is not used in module texts: in code, string literals and comments. Each occurrence is reported. Ported from the APK check АПК_00260 (standard 598).
ApkYoLetterCheck_Yo_letter_is_not_allowed_in_module_text = The letter {0} is not allowed in the module text: {1}, line {2}
ApkSumInQueryCheck_title = SUM() function with a numeric operand in queries in module texts
ApkSumInQueryCheck_description = Checks that query texts in modules do not call the SUM() function with a constant numeric operand to count records: with 10 million records and more the number overflows because of the default number capacity. Use the QUANTITY function instead. Ported from the APK check АПК_01192 (standard 787).
ApkSumInQueryCheck_Sum_with_constant_operand_in_query = The function {0} is used in a query text: use QUANTITY instead of SUM to count records, the number overflows with 10 million records and more ({1}, line {2})
ApkQueryFieldAliasCheck_title = Query alias matches a metadata object class name
ApkQueryFieldAliasCheck_description = Checks that aliases in query texts in modules (after the КАК/AS keywords) are not named after metadata object class names (e.g. Справочник, Документ, Catalog, Document); source and field aliases should be meaningful, formed from the domain terms like variable names. Ported from the APK check АПК_01216 (standard 758).
