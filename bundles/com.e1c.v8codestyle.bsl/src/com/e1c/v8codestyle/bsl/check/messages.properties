EmptyCodeBlockCheck_title = Empty code block
EmptyCodeBlockCheck_description = Checks that conditional and loop code blocks are not empty. An empty block is a sign of a forgotten implementation or deleted content. Method bodies, "Except" blocks and the module file block are not checked. Parameter "Treat comments as code" (off by default): a block containing comments is not considered empty. Ported from the BSL Language Server diagnostic EmptyCodeBlock.
