SelfReferenceCheck_check_only_existing_form_properties = Check only existing form properties

ServerExecutionSafeModeCheck_description = Safe mode is not enabled when calling "Execute" or "Eval'

ServerExecutionSafeModeCheck_eval_issue = Safe mode is not enabled when calling "Eval"

ServerExecutionSafeModeCheck_execute_issue = Safe mode is not enabled when calling "Execute"

ServerExecutionSafeModeCheck_title = Safe mode is not enabled when calling "Execute" or "Eval"

StructureCtorTooManyKeysCheck_Maximum_structure_constructor_keys = Maximum structure constructor keys

StructureCtorTooManyKeysCheck_Structure_constructor_has_more_than__0__keys = Structure constructor has more then {0} keys

StructureCtorTooManyKeysCheck_description = Check structure constructor has too many keys

StructureCtorTooManyKeysCheck_title = Structure constructor has too many keys

SecuritySoftwareCall_Description = Check macros enable

SecuritySoftwareCall_Title = Check macros enable

SecuritySoftwareCall_Issue = Need disable macros

UseGotoOperatorCheck_Use_Goto_operator = Use Goto operator

UseGotoOperatorCheck_Use_Label_with_Goto_operator = Use Label with Goto operator

UseGotoOperatorCheck_description = Use Goto operator

UseGotoOperatorCheck_title = Use Goto operator

UnknownFormParameterAccessCheck_Unknown_form_parameter_access = Unknown form parameter "{0}" access

UnknownFormParameterAccessCheck_description = Unknown form parameter access

UnknownFormParameterAccessCheck_title = Unknown form parameter access

UseNonRecommendedMethods_description = Using non-recommended methods

UseNonRecommendedMethods_message = Using non-recommended method

UseNonRecommendedMethods_parameter = List of non-recommended methods

UseNonRecommendedMethods_title = Using non-recommended methods

VariableNameInvalidCheck_description = Variable name is invalid

VariableNameInvalidCheck_message_variable_length_is_less_than = variable length is less than {0}

VariableNameInvalidCheck_param_MIN_NAME_LENGTH_PARAM_title = Min. lenght of variable name

VariableNameInvalidCheck_title = Variable name is invalid

VariableNameInvalidCheck_variable_name_is_invalid = Variable name {0} is invalid: {1}

VariableNameInvalidCheck_variable_name_must_start_with_a_capital_letter = variable name must start with a capital letter

VariableNameInvalidCheck_variable_name_starts_with_an_underline = variable name starts with an underline

EmptyStatementCheck_title = Empty statement
EmptyStatementCheck_description = Checks that the module has no empty statements ";". An extra semicolon is noise that makes code harder to read.
EmptyStatementCheck_Remove_empty_statement = Remove ";"

UselessTernaryOperatorCheck_title = Useless ternary operator
UselessTernaryOperatorCheck_description = Checks the ternary operator ?(Condition, Branch1, Branch2) whose result is known in advance: the condition is a Boolean constant, or both branches are Boolean constants (?(X, True, False) is X, ?(X, False, True) is NOT X), or both branches are the same.
UselessTernaryOperatorCheck_Useless_ternary_operator = Useless ternary operator

TernaryOperatorUsageCheck_title = Ternary operator usage
TernaryOperatorUsageCheck_description = The If-Then-Else statement is recommended instead of the ternary operator. The check is disabled by default (as in BSL Language Server) and is enabled in the check settings.
TernaryOperatorUsageCheck_Use_if_instead_of_ternary_operator = Use If-Then-Else instead of the ternary operator

NestedTernaryOperatorCheck_title = Nested ternary operator
NestedTernaryOperatorCheck_description = Nested ternary operators and ternary operators in If/ElsIf conditions are hard to read. Use If-Then-Else statements and intermediate variables instead.
NestedTernaryOperatorCheck_Nested_ternary_operator = Nested ternary operator is not recommended

IfElseDuplicatedCodeBlockCheck_title = Duplicated code blocks in "If" statement
IfElseDuplicatedCodeBlockCheck_description = Checks that the "If...Then...ElsIf..." statement has no duplicated code blocks. A duplicated branch is a probable copy-paste error or a sign of a redundant condition.
IfElseDuplicatedCodeBlockCheck_Duplicated_code_block = The "If...Then...ElsIf..." statement contains duplicated code blocks (branch {0} repeats branch {1})

IdenticalExpressionsCheck_title = Identical expressions on the left and right of the operator
IdenticalExpressionsCheck_description = Checks binary expressions with identical left and right operands, for example "A = A" or "A = 1 And A = 1". Usually this is an error: the operator does not do what the author expected. Repeating an operand in addition/multiplication is allowed; division by popular divisors (parameter, default "60, 1024") is not treated as an error.
IdenticalExpressionsCheck_Identical_expressions = Identical sub-expressions on the left and right of the "{0}" operator: "{1}"
IdenticalExpressionsCheck_Popular_divisors = Popular divisors (comma-separated) that are not treated as an identical-operand error in division

RewriteMethodParameterCheck_title = Rewrite method parameter
RewriteMethodParameterCheck_description = Checks that a parameter passed by value (Val) is not rewritten before its first use. The passed value is lost, which is probably an error. Modification like "Parameter = Parameter + 1" is not a rewrite; parameters passed by reference are not checked (as in BSL LS).
RewriteMethodParameterCheck_Parameter_rewrite_without_use = Parameter "{0}" is rewritten without use

OneStatementPerLineCheck_title = One statement per line
OneStatementPerLineCheck_description = Checks that a line contains a single statement. Multiple statements on one line make code harder to read and debug. Preprocessor instructions and empty statements are not counted; each statement of the line is reported (as in BSL LS).
OneStatementPerLineCheck_Move_to_new_line = Move the expression to a new line

UsingHardcodePathCheck_title = Using hardcode file paths in code
UsingHardcodePathCheck_description = Checks string literals for Windows/Unix file paths. A hardcoded path depends on the machine the code runs on. URLs (ftp/http/https) are not checked; Unix paths are only checked against standard root folders (parameter). The check has no quick fix: how to store the path is up to the user (setting/constant).
UsingHardcodePathCheck_Hardcode_path = Detected storage of file path in code: "{0}"
UsingHardcodePathCheck_Std_paths_unix = Search keywords for standard Unix root folders (separated by |)

UsingHardcodeNetworkAddressCheck_title = Using hardcode ip addresses in code
UsingHardcodeNetworkAddressCheck_description = Checks string literals for IPv4/IPv6 addresses. A hardcoded address depends on the environment the code runs on. URLs are not checked; version-like values (parameter) and statements with exclusion words (parameter) are skipped. The check has no quick fix: how to store the address is up to the user (setting/constant).
UsingHardcodeNetworkAddressCheck_Hardcode_ip_address = Detected storage of ip address in code: "{0}"
UsingHardcodeNetworkAddressCheck_Exclusion_words = Keywords to exclude statements from search (separated by |)
UsingHardcodeNetworkAddressCheck_Popular_version_exclusion = Regular expression to exclude popular versions from search

UsingHardcodeSecretInformationCheck_title = Storing confidential information in code
UsingHardcodeSecretInformationCheck_description = Checks the code for storing confidential information (passwords): variable assignment, structure/map key or property, "Insert" method, "New Structure(...)" constructor, FTP/HTTP connection password. Masked values ("***") are not reported. The check has no quick fix: how to store a password is up to the user (SecureStorage/settings).
UsingHardcodeSecretInformationCheck_Hardcode_secret = The storage of confidential information in the code is used: "{0}"
UsingHardcodeSecretInformationCheck_Hardcode_secret_in_connection = The storage of confidential information (connection password) in the code is used: "{0}"
UsingHardcodeSecretInformationCheck_Search_words = Search keywords for confidential information in variables, structures, mappings (separated by |)

DeprecatedFindCheck_title = Using of the deprecated method "Find"
DeprecatedFindCheck_description = Checks the use of the deprecated global method Find. Use StrFind instead: it has clear argument semantics and more search capabilities. Object methods (Object.Find) are not checked. This check replaces Find in the default list of use-non-recommended-method.
DeprecatedFindCheck_Use_StrFind_instead_of_Find = Use "StrFind" instead of deprecated "Find"

DeprecatedCurrentDateCheck_title = Using of the deprecated method "CurrentDate"
DeprecatedCurrentDateCheck_description = Checks the use of the deprecated method CurrentDate: the current time may differ on the client and the server, which leads to unpredictable behavior. Use CurrentSessionDate instead. This check replaces CurrentDate in the default list of use-non-recommended-method.
DeprecatedCurrentDateCheck_Use_CurrentSessionDate_instead_of_CurrentDate = Use "CurrentSessionDate" instead of deprecated "CurrentDate"

SpaceAtStartCommentCheck_title = Space at the start of comment
SpaceAtStartCommentCheck_description = Checks that a comment text is separated from "//" by a space. Comment annotations (parameter, default "//@,//(c),//") and comments that look like commented code are not reported (as in BSL LS).
SpaceAtStartCommentCheck_Space_at_comment_start = A space between "//" and the comment text is required
SpaceAtStartCommentCheck_Comments_annotation = Skip comment annotations starting with these substrings (comma-separated)

CommentedCodeCheck_title = Commented out code fragment
CommentedCodeCheck_description = Checks that program modules have no commented out code fragments: the place for unused code is in the version control system, not in comments. Adjacent comment lines are grouped; a group is reported if it is recognized as code (the threshold parameter, default 0.9, as in BSL LS). Method documentation headers are not reported; exclusion prefixes can be set by parameter.
CommentedCodeCheck_Commented_out_code = Program modules should not have commented out code fragments
CommentedCodeCheck_Threshold = Recognition threshold (0 to 1)
CommentedCodeCheck_Exclusion_prefixes = Exclusion prefixes (comma-separated); a comment whose text starts with one of them is not analyzed

OSUsersMethodCheck_title = Using the OS users method
OSUsersMethodCheck_description = Checks the use of the OSUsers method. Getting information about operating system users is potentially dangerous: it requires justification and an access restriction.
OSUsersMethodCheck_Check_potentially_malicious_use_of_OS_users_method = Check the potentially malicious use of the OS users method

TimeoutsInExternalResourcesCheck_title = Timeouts when working with external resources
TimeoutsInExternalResourcesCheck_description = Checks that a timeout is specified when creating FTPConnection, HTTPConnection, WSDefinitions, WSProxy and InternetMailProfile: the timeout constructor parameter is filled or the "Timeout" property is assigned to the variable below with a number or a variable. Without a timeout, the session may hang indefinitely.
TimeoutsInExternalResourcesCheck_Timeout_not_specified = The timeout is not specified when working with the external resource
TimeoutsInExternalResourcesCheck_Analyze_mail = Analyze the timeout of InternetMailProfile

MissingSpaceCheck_title = Missing space
MissingSpaceCheck_description = Checks for spaces around operators (=, <, >, <=, >=, <>, %, +, -, *, /) and after comma and semicolon. Comments and string literals are not analyzed. Arithmetic signs are checked on the left side only (the right side of a unary sign is not checked, as in BSL LS by default).
MissingSpaceCheck_Missing_space = Missing space {0} of the "{1}"
MissingSpaceCheck_Left = to the left
MissingSpaceCheck_Right = to the right

MagicNumberCheck_title = Magic number
MagicNumberCheck_description = Checks the code for magic numbers. Use named constants instead of unexplained numbers. Authorized numbers (parameter, default "-1, 0, 1"), index access (parameter), method parameter default values and flat date components Date(...) are not reported.
MagicNumberCheck_Magic_number = Magic number "{0}"
MagicNumberCheck_Authorized_numbers = Authorized numbers (comma-separated)
MagicNumberCheck_Allow_magic_indexes = Allow magic numbers in index access

MagicDateCheck_title = Magic date
MagicDateCheck_description = Checks the code for magic dates (literals like '20260101'). Use named constants or function results instead. The empty date and authorized dates (parameter) are not reported; as in BSL LS, the right side of a simple assignment and the expression of "Return" are not reported.
MagicDateCheck_Magic_date = Magic date "{0}"
MagicDateCheck_Authorized_dates = Authorized dates (comma-separated)

IfConditionComplexityCheck_title = Complex condition in "If" statement
IfConditionComplexityCheck_description = Checks that a condition of "If"/"ElsIf" has no more logical "And"/"Or" operations than the maximum (parameter, default 3, as in BSL LS). Split a complex condition into intermediate variables or separate statements.
IfConditionComplexityCheck_Too_many_conditions = The condition has too many logical operations: {0} (maximum {1})
IfConditionComplexityCheck_Max_condition_complexity = Maximum number of logical operations in a condition

NestedStatementsCheck_title = Too many nested statements
NestedStatementsCheck_description = Checks the nesting depth of "If", loops and "Try" statements: deep nesting makes code hard to read and maintain (parameter, default 4, as in BSL LS). Statements deeper than the maximum are reported.
NestedStatementsCheck_Too_many_nested_statements = Statement is nested too deeply: level {0} (maximum {1})
NestedStatementsCheck_Max_allowed_level = Maximum nesting level

CyclomaticComplexityCheck_title = Cyclomatic complexity of method is too high
CyclomaticComplexityCheck_description = Checks the cyclomatic complexity of a method: 1 plus the number of If/ElsIf branches, loops, "And"/"Or" operations and ternary operators (parameter, default 20, as in BSL LS). Split a complex method into several.
CyclomaticComplexityCheck_Cyclomatic_complexity = Cyclomatic complexity of the method is {0} (maximum {1})
CyclomaticComplexityCheck_Complexity_threshold = Cyclomatic complexity threshold

CognitiveComplexityCheck_title = Cognitive complexity of method is too high
CognitiveComplexityCheck_description = Checks the cognitive complexity of a method: each "If"/"ElsIf"/loop/"Try" structure adds 1 plus its nesting depth, each "And"/"Or" adds 1 (simplified port of BSL LS, parameter default 15). Split a complex method into several.
CognitiveComplexityCheck_Cognitive_complexity = Cognitive complexity of the method is {0} (maximum {1})
CognitiveComplexityCheck_Complexity_threshold = Cognitive complexity threshold

UsingModalWindowsCheck_title = Using modal windows
UsingModalWindowsCheck_description = Checks the use of modal methods (QueryBox, OpenFormModal, OpenValue, DoMessageBox, InputDate, InputValue, InputString, InputNumber): they do not work in the web client. Use asynchronous analogues (ShowQueryBox, OpenForm, ShowValue, etc.), as in BSL LS.
UsingModalWindowsCheck_Do_not_use_modal_windows = Do not use modal windows: use the asynchronous analogue of the method

MissingTempStorageDeletionCheck_title = Missing temp storage deletion
MissingTempStorageDeletionCheck_description = Checks that data received from temp storage (GetFromTempStorage) is later deleted (DeleteFromTempStorage). Without deletion the data stays in the server memory until the session ends. Simplification: the check reports all GetFromTempStorage calls of a method if the method has no deletion at all.
MissingTempStorageDeletionCheck_Missing_temp_storage_deletion = The data of temp storage is not deleted after use

UnusedParametersCheck_title = Unused method parameter
UnusedParametersCheck_description = Checks that all method parameters are used in the method body. An unused parameter is misleading: callers must pass it for no reason (as in BSL LS). The check has no quick fix: removing a parameter changes the signature and the callers.
UnusedParametersCheck_Unused_parameter = Parameter "{0}" is not used in the method body

ApkReuseModuleReturnCheck_title = Meaningless methods in common module with return value reuse
ApkReuseModuleReturnCheck_description = Checks common modules with return value reuse (cached): an export procedure has no effect because procedures return no values, and a function consisting of a single "Return <constant>" statement that returns a string, number, boolean, date or a predefined item (Catalogs.X.Y and similar) computes faster than fetching from the cache and needlessly fills it.
ApkReuseModuleReturnCheck_Export_procedure_is_meaningless = An export procedure has no effect in a common module with return value reuse: procedures do not return values
ApkReuseModuleReturnCheck_Function_returns_constant = The function returns a constant that is computed faster than fetching it from the cache: do not cache primitive constants or predefined items

ApkSessionParamInitCheck_title = Session parameters shall be initialized in the session module
ApkSessionParamInitCheck_description = Checks that session parameters (SessionParameters.Name) are assigned only in the session module. Initialization of session parameters in any other module is reported; reading a session parameter is allowed everywhere.
ApkSessionParamInitCheck_Session_parameter_assignment = Session parameters shall be initialized in the session module
ObsoleteObjectModuleCheck_title = Code in module of obsolete metadata object
ObsoleteObjectModuleCheck_description = Checks that all modules of an obsolete metadata object are empty. An object is obsolete when its name (or the name of its top parent) starts with "Удалить"/"Delete"/"Obsolete" (case-insensitive): an obsolete object is deleted along with its code, forms and other redundant elements. A module is empty when it has no executable statements: comments and blank lines are allowed. Each non-empty module is reported.
ObsoleteObjectModuleCheck_Module_has_code = The module of the obsolete metadata object "{0}" contains code. Delete the code, forms and other redundant elements of the obsolete object

OverridableModuleNonExportMethodCheck_title = Non-export method in overridable common module
OverridableModuleNonExportMethodCheck_description = Checks that an overridable common module (its name contains "Переопределяемый"/"Override") has no non-export methods: only export methods that override the library methods are allowed. A non-export method of an overridable module is never called by the override mechanism. Adopted (borrowed) modules of extension projects are not checked.
OverridableModuleNonExportMethodCheck_Method_is_not_export = Method "{0}" is not export in the overridable common module "{1}". Make the method export or move it out of the overridable module

OverridableModuleNonDeprecatedFunctionCheck_title = Non-deprecated function in overridable common module
OverridableModuleNonDeprecatedFunctionCheck_description = Checks that an overridable common module (its name contains "Переопределяемый"/"Override") has no functions except deprecated ones kept for backward compatibility: a function of an overridable module is never called by the override mechanism. A function is deprecated when it is marked with the "Устарела."/"Deprecated." comment or placed in the "УстаревшиеПроцедурыИФункции"/"Deprecated" region. Adopted (borrowed) modules of extension projects are not checked.
OverridableModuleNonDeprecatedFunctionCheck_Function_is_not_deprecated = Function "{0}" is not deprecated in the overridable common module "{1}". Replace the function with a procedure or mark it as deprecated

OverridableModuleTopRegionCheck_title = Top-level region other than "Public" in overridable common module
OverridableModuleTopRegionCheck_description = Checks that an overridable common module (its name contains "Переопределяемый"/"Override") has no top-level regions except "ПрограммныйИнтерфейс"/"Public": the whole overridable module is placed in the "ПрограммныйИнтерфейс"/"Public" region. Nested regions (inside other regions) are allowed. Adopted (borrowed) modules of extension projects are not checked.
OverridableModuleTopRegionCheck_Region_is_not_allowed = Top-level region "{0}" is not allowed in the overridable common module "{1}". Use only the "ПрограммныйИнтерфейс"/"Public" region
TypeByMetadataNameCheck_title = Type of a variable value should be determined by comparing with a type, not by metadata name
TypeByMetadataNameCheck_description = Checks that the type of a variable value is determined by comparing the value type with a type, for example TypeOf(Ref) = Type("DocumentRef.GoodsReceipt"), instead of comparing a metadata name or full name with a string. Determining the type by metadata name is unreliable and may lead to errors. Ported from the APK check АПК_00305 (standard 442).
TypeByMetadataNameCheck_Type_determined_by_metadata_name = Do not determine the value type by metadata name, compare the value type with a type: TypeOf(Value) = Type("...")
UsingSynchronousCallsCheck_title = Using synchronous calls
UsingSynchronousCallsCheck_description = Checks the use of synchronous global context methods (QueryBox, OpenFormModal, DoMessageBox, PutFile, FindFiles, RunApp, etc.) in client modules when the configuration restricts synchronous calls: they do not work in the web client. Use asynchronous analogues (ShowQueryBox, OpenForm, BeginPutFile, etc.). Calls in methods with the AtServer/AtServerNoContext compiler directives are not checked, as well as strictly server modules.
UsingSynchronousCallsCheck_message = Instead of the synchronous method `{0}`, use `{1}`
ApkCutCommentsFormatCheck_title = Cut service comments formatting
ApkCutCommentsFormatCheck_description = Checks the formatting of cut service comments ("// Локализация", "// Конец Локализация", "// _Демо начало примера", "// _Демо конец примера") that frame code fragments removed when building the international release: an invalid comment format or case, comments forbidden in modules without the "Локализация" postfix, a missing comment pair in a common module with the postfix, unbalanced opening/closing comments. Ported from the APK check АПК_01219 (standard 769).
ApkCutCommentsFormatCheck_Wrong_comment_format = The cut service comment format is invalid (expected "// Локализация", "// Конец Локализация", etc.)
ApkCutCommentsFormatCheck_Comment_not_allowed = The cut service comment "// Локализация" is not allowed in a module without the "Локализация" postfix
ApkCutCommentsFormatCheck_Localization_module_missing_comment = A common module with the "Локализация" postfix is missing the mandatory cut service comment "// Локализация" or "// Конец Локализация"
ApkCutCommentsFormatCheck_Missing_pair = A paired opening or closing cut service comment is missing (for example, "// Локализация" is found but "// Конец Локализация" is not)

ApkStringConcatInLoopCheck_title = Bulk string concatenation in a loop
ApkStringConcatInLoopCheck_description = Checks that a string variable is not accumulated in a loop via concatenation (Var = Var + ...). For bulk operations use StrJoin (СтрСоединить) and StrSplit (СтрРазделить) instead: they are faster and use less memory. One issue per loop; numeric counters (Counter = Counter + 1) are not reported. Static approximation of the APK check АПК_01171 (standard 782): the original rule counts concatenations at runtime (threshold of 1000).
ApkStringConcatInLoopCheck_String_concatenation_in_loop = Strings are accumulated in the loop via concatenation: for bulk operations use StrJoin (СтрСоединить) and StrSplit (СтрРазделить) instead
ApkScheduledJobsManagerCheck_title = Access to the scheduled jobs manager in code
ApkScheduledJobsManagerCheck_description = Checks the direct access to the scheduled jobs manager (ScheduledJobs) - the beginning of an access chain named "ScheduledJobs". To manage scheduled jobs, use the BSP program interface from the ScheduledJobsServer module (standard 760, clause 3). Common modules whose name starts with "ScheduledJobs" are not checked. The check is disabled by default: the APK precondition "the solution contains the StandardSubsystems subsystem" cannot be reproduced statically.
ApkScheduledJobsManagerCheck_Direct_manager_access = Do not access the scheduled jobs manager "{0}" directly: use the BSP program interface ScheduledJobsServer

ApkFileGlobalMethodsCheck_title = Using global context methods for file operations
ApkFileGlobalMethodsCheck_description = Checks the use of the global context file methods (PutFile, BeginPutFile, PutFiles, BeginPuttingFiles, GetFile, GetFiles, BeginGettingFiles) and the "Show" call of a variable holding "New FileDialog". In solutions based on BSP use the FileSystemClient program interface (LoadFile, SaveFiles, ChooseFolder, etc.) instead. The FileDialog tracking is one level deep (a variable assigned in the same method), as in APK. Common modules FileSystemClient and FileSystemServiceClient are not checked. The check is disabled by default: the APK precondition "the solution contains the StandardSubsystems subsystem" cannot be reproduced statically.
ApkFileGlobalMethodsCheck_Global_file_method = Instead of the global method "{0}" use the BSP program interface FileSystemClient
ApkFileGlobalMethodsCheck_File_dialog_show = Instead of the modal "FileDialog.Show" use the BSP program interface FileSystemClient

ApkRegistrarAccessCheck_title = Register self-sufficiency: access to the Recorder attribute
ApkRegistrarAccessCheck_description = Checks that the register record set module does not access the Recorder attribute via dot. Dereferencing the recorder breaks register self-sufficiency: register logic and reports must rely on the register data only. Dot dereferencing leads to implicit joins with additional tables, and in a distributed infobase the recorder may be missing while register records migrate between nodes. Allowed accesses (as in the APK algorithm): Filter.Recorder, StandardAttributes.Recorder, Recorder.ValueType, Recorder.Metadata(), Recorder.GetObject(), Recorder.MomentOfTime(). The search covers the module text including comments and query string literals. Ported from the APK check АПК_00150 (standard 477).
ApkRegistrarAccessCheck_Registrar_access_breaks_self_sufficiency = Access to the "Регистратор" (Recorder) attribute by dot in the register record set module breaks the register self-sufficiency (line {0})
ApkNoYouPronounCheck_title = Messages should not address the user with "You" pronouns
ApkNoYouPronounCheck_description = Checks that user-facing message texts (string literals) do not use the second-person pronouns "Вы", "Вас", "Вам", "Вами", "Ваш": messages are composed as impersonal sentences. Only whole words are reported; words like "Вашего", "Выполнить" or "Василий" are not. Comments are not checked. One issue per source line. Ported from the APK check АПК_00714 (standard 585).
ApkNoYouPronounCheck_Message_addresses_user_with_pronoun = The message addresses the user with the pronoun "{0}" (module {1}, line {2}): compose messages as impersonal sentences

ApkNoExclamationMarkCheck_title = Messages should not contain exclamation marks
ApkNoExclamationMarkCheck_description = Checks that user-facing message texts (string literals) do not contain exclamation marks: they sound commanding and make the user feel blamed. Exceptions (not reported): the warning word "Внимание!" ("Attention!"), an exclamation mark followed by an operator or xsl code ("!=" and similar), bat-file parameters (!args!, !setup.exe!, !directory!), and a mark not preceded by a letter, digit or "()" method call. Comments are not checked. One issue per source line. Ported from the APK check АПК_00715 (standard 585).
ApkNoExclamationMarkCheck_Message_contains_exclamation_mark = The message contains an exclamation mark (module {0}, line {1}): remove it or keep it only for warnings of dangerous actions ("Внимание!")

ApkLinuxUnsupportedCheck_title = Methods and objects not supported on Linux
ApkLinuxUnsupportedCheck_description = Checks that the code does not use methods and objects not supported on Linux: add-in methods (LoadAddIn/ЗагрузитьВнешнююКомпоненту, AttachAddIn/ПодключитьВнешнююКомпоненту, AttachAddInAsync/ПодключитьВнешнююКомпонентуАсинх, BeginAttachingAddIn/НачатьПодключениеВнешнейКомпоненты), the COM variant of the AddInType enum (ТипВнешнейКомпоненты.COM), the COMObject (COMОбъект), Mail (Почта) and TextExtraction (ИзвлечениеТекста) objects, and the File and ClientApplication methods SetHidden (УстановитьНевидимость), SetHiddenAsync (УстановитьНевидимостьАсинх), GetOSCaptionRepresentation (ПолучитьОтображениеЗаголовкаОС), SetOSCaptionRepresentation (УстановитьОтображениеЗаголовкаОС). The search covers the whole module text including comments and string literals (as in the APK algorithm); each occurrence is reported. The APK precondition "the rule runs only on Linux" cannot be reproduced statically, so the check is disabled by default (audit). Ported from the APK check АПК_01364 (standard 723).
ApkLinuxUnsupportedCheck_Unsupported_construct = The method or object "{0}" is not supported on Linux (line {1}); use cross-platform mechanisms instead

ApkPathSeparatorMaskCheck_title = Path separator and all-files mask specified manually
ApkPathSeparatorMaskCheck_description = Checks that the path separator ("\", "/") and the all-files mask ("*.*") are not specified manually in the literal string parameters of the file search methods: FindFiles (НайтиФайлы) - parameters 1 and 2, BeginFindingFiles (НачатьПоискФайлов) - parameters 2 and 3, the "New File" (Новый Файл) constructor - parameter 1. Use the GetPathSeparator (ПолучитьРазделительПути) and GetAllFilesMask (ПолучитьМаскуВсеФайлы) functions instead: separators and masks differ between Windows and Linux. In solutions based on BSP use the functions of the CommonModules CommonFunctions (ОбщегоНазначения) and CommonFunctionsClient (ОбщегоНазначенияКлиент). Parameters that are variables or expressions are not checked. Ported from the APK check АПК_01167 (standard 723, clause 2.5.2).
ApkPathSeparatorMaskCheck_Manual_path_separator = Do not specify the path separator manually: use the GetPathSeparator (ПолучитьРазделительПути) function
ApkPathSeparatorMaskCheck_Manual_all_files_mask = Do not specify the all-files mask "*.*" manually: use the GetAllFilesMask (ПолучитьМаскуВсеФайлы) function
ApkMainLanguageCodeCheck_title = Main language code is obtained via Metadata.MainLanguage
ApkMainLanguageCodeCheck_description = When the Standard Subsystems Library (SSL) is used, the main language code shall be obtained by calling the MainLanguageCode function of the Common (ОбщегоНазначения) common module instead of accessing Metadata.MainLanguage (Metadata.MainLanguage.LanguageCode). The only allowed place is the MainLanguageCode function of the Common module itself. Ported from the APK check АПК_01205.
ApkMainLanguageCodeCheck_Use_MainLanguageCode_function = Get the main language code with the MainLanguageCode function of the Common (ОбщегоНазначения) common module instead of Metadata.MainLanguage

ApkUpdateHandlerVersionFormatCheck_title = Invalid version format in the infobase update handler
ApkUpdateHandlerVersionFormatCheck_description = Checks that the version assigned to a handler in the OnAddUpdateHandlers (ПриДобавленииОбработчиковОбновления) procedure (Handler.Version = "...") is either "*" or a version number in the "M.m.v.b" or "M.m.v" format: at least three dot-separated segments, each segment contains digits only. An empty version is not reported (it shall be accompanied by the InitialFill = True property, which is out of scope of this check). Ported from the APK check АПК_01190 (standard 690).
ApkUpdateHandlerVersionFormatCheck_Invalid_version_format = The update handler version shall be "*", or a number in the "M.m.v.b" or "M.m.v" format: at least three dot-separated segments, digits only
ApkConstantWriteInTransactionCheck_title = Constant is written inside a transaction

ApkConstantWriteInTransactionCheck_description = Checks that constants are written (Constants.<Name>.Set(...)/Write(...) - рус. Константы.<Имя>.Установить/Записать) outside transactions: while a constant is being written, other sessions that write the same constant are suspended, so writing inside a transaction becomes a bottleneck in concurrent use. A call is reported when it is lexically placed in the same method between the BeginTransaction (рус. НачатьТранзакцию) and CommitTransaction (рус. ЗафиксироватьТранзакцию) calls - by statement positions, without unfolding nested If/loops. A transaction opened in another method is not tracked; constant reads and writes of other objects are not reported. The APK rule 00157 (simplified: item 2 of the APK algorithm - workarounds of constant locking via total caching - is not checked).

ApkConstantWriteInTransactionCheck_Constant_write_in_transaction = The constant is written inside a transaction: write constants outside transactions, otherwise concurrent sessions writing the same constant are suspended
OverridableModuleRedundantCodeCheck_title = Redundant code in overridable common module procedure
OverridableModuleRedundantCodeCheck_description = Checks that a procedure of an overridable common module (its name contains "Переопределяемый"/"Override") that overrides a same-named method of another common module consists only of calls of the overridden method: each statement has the form "Module.Method(...)". Assignments, conditions, loops and local calls are redundant: the overriding procedure must be reduced to the call of the original. Calls of forms "Module.Method(...)", "Common.CommonModule("Module").Method(...)" and a call via a variable assigned with "Common.CommonModule("Module")" are recognized (the assignment itself is redundant, as in the APK). Code between the "// _Демо начало примера" and "// _Демо конец примера" comments is not checked. One issue per procedure - the first redundant statement. Disabled by default: enable it for configurations developed on top of a library hierarchy.
OverridableModuleRedundantCodeCheck_Redundant_code = Redundant code in the overriding procedure "{0}" of the overridable common module "{1}": "{2}". The procedure must be reduced to a single call of the overridden method: Module.Method(...)

OverridableModuleProcedureNameCheck_title = Called method name differs from overriding procedure name
OverridableModuleProcedureNameCheck_description = Checks that a procedure of an overridable common module (its name contains "Переопределяемый"/"Override") that has a same-named pair method in another common module calls that pair: the called method name equals the overriding procedure name. A call of a differently named method of a common module is reported (each call is reported separately). Calls of forms "Module.Method(...)", "Common.CommonModule("Module").Method(...)" and a call via a variable assigned with "Common.CommonModule("Module")" are recognized. Code between the "// _Демо начало примера" and "// _Демо конец примера" comments is not checked. Disabled by default: enable it for configurations developed on top of a library hierarchy.
OverridableModuleProcedureNameCheck_Method_name_does_not_match = The overriding procedure "{1}" of the overridable common module "{2}" calls method "{0}": the called method name must equal the overriding procedure name

OverridableModuleParametersCheck_title = Called method parameters differ from overriding procedure parameters
OverridableModuleParametersCheck_description = Checks that a call of the overridden method from a procedure of an overridable common module (its name contains "Переопределяемый"/"Override") passes all parameters of the overriding procedure in the same order: parameter names and their count are compared by position (types are not declared in 1C). Each call with a mismatching parameter count, order or names is reported. Calls of forms "Module.Method(...)", "Common.CommonModule("Module").Method(...)" and a call via a variable assigned with "Common.CommonModule("Module")" are recognized. Code between the "// _Демо начало примера" and "// _Демо конец примера" comments is not checked. Disabled by default: enable it for configurations developed on top of a library hierarchy.
OverridableModuleParametersCheck_Parameters_count_does_not_match = The call of the overriding procedure "{2}" passes {0} parameters, but the procedure declares {1}: pass all parameters of the overriding procedure in the same order
OverridableModuleParametersCheck_Parameters_order_does_not_match = The call parameter {0} "{1}" does not match the parameter "{2}" of the overriding procedure "{3}": pass all parameters of the overriding procedure in the same order

OverridableModuleSeeCommentCheck_title = No "See Module.Method" comment on the called method
OverridableModuleSeeCommentCheck_description = Checks that the method of a library common module called from an overriding procedure of an overridable common module (its name contains "Переопределяемый"/"Override") has the reference comment "См. <OverridableModule>.<Procedure>." above its declaration (blank lines between the comment and the declaration are allowed). After normalization (without "/", spaces and line breaks) the comment must start with "См.<Module>.<Method>"; the case of "См." and the names is significant, as in the APK. The issue is reported on the overriding procedure (the APK reports it on the called module). Calls of forms "Module.Method(...)", "Common.CommonModule("Module").Method(...)" and a call via a variable assigned with "Common.CommonModule("Module")" are recognized. Disabled by default: enable it for configurations developed on top of a library hierarchy.
OverridableModuleSeeCommentCheck_Missing_see_comment = The called method "{0}.{1}" has no reference comment "См. {2}.{3}." above its declaration: add the comment to the called method

UnreachableCodeLiteCheck_title = Unreachable code
UnreachableCodeLiteCheck_description = Checks that statements following Return (rus. "Возврат") or Raise (rus. "ВызватьИсключение") in the same block can never be executed: such code usually remains after editing and signals an error in the algorithm. A block is a method body, an If/ElseIf/Else branch, a loop body, or a Try/Except section; one issue is reported per block - on its first unreachable statement. If all branches of an If (If + all ElseIf + Else) terminate with Return or Raise, statements after the EndIf in the same block are unreachable as well. The lite check does not build a control flow graph (unlike the BSL Language Server unreachable-code diagnostic): statements after Break/Continue/Goto are not detected, neither are dead conditions and module-level (non-method) code. Based on the upstream issue 1C-Company/v8-code-style#1068.
UnreachableCodeLiteCheck_Unreachable_code = Correct the algorithm because this code will never be executed
