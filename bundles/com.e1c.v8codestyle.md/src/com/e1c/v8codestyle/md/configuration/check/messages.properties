ConfigurationRequiredRolesCheck_title = Required role is missing

ConfigurationRequiredRolesCheck_description = The configuration must define the three mandatory roles of the standard 488: "ПолныеПрава" (FullAccess) for application administration, "АдминистраторСистемы" (SystemAdministrator) for system administration and "ИнтерактивноеОткрытиеВнешнихОтчетовИОбработок" (InteractiveOpenExternalReportsAndDataProcessors) for interactive opening of external reports and data processors. A role is found by its name; both the Russian and the English standard names are accepted. Each missing role is reported on the configuration. Extension configurations are not checked.

ConfigurationRequiredRolesCheck_Role_is_missing = The required role "{0}" is missing in the configuration
