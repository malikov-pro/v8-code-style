DbObjectStringAllowedLengthCheck_title = String attribute has fixed allowed length

DbObjectStringAllowedLengthCheck_description = For string attributes use variable length (the allowed length property is VARIABLE) and specify the maximum length. Fixed length is justified only when the guarantee of the exact string length is really needed. The АПК rule 00139.

DbObjectStringAllowedLengthCheck_message = String attribute "{0}" has fixed allowed length. Use variable length instead, unless the guarantee of the exact string length is really needed

DbObjectUnlimitedStringCheck_title = String attribute has unlimited length

DbObjectUnlimitedStringCheck_description = Unlimited length strings are allowed only for user texts of potentially significant volume or for technical information. If the maximum possible length of the string can be estimated, use a limited string instead. The check is a manual audit and is disabled by default. The АПК rule 00141.

DbObjectUnlimitedStringCheck_message = String attribute "{0}" has unlimited length. If the maximum possible length can be estimated, use a limited string instead

MdObjectDeleteSynonymPrefixCheck_title = The "Удалить" name prefix of an obsolete object does not match the "(не используется)" synonym prefix

MdObjectDeleteSynonymPrefixCheck_description = An obsolete metadata object that cannot be deleted yet is renamed with the "Удалить" ("Delete") name prefix, and the "(не используется)" prefix is added to its synonym. The name prefix and the synonym prefix must be used together. The АПК rule 00156.

MdObjectDeleteSynonymPrefixCheck_Name_prefix_without_synonym_prefix = The name "{0}" starts with "Удалить"/"Delete" but the synonym "{1}" does not start with "(не используется)". Add the "(не используется)" prefix to the synonym or delete the obsolete object

MdObjectDeleteSynonymPrefixCheck_Synonym_prefix_without_name_prefix = The synonym "{1}" starts with "(не используется)" but the name "{0}" does not start with "Удалить"/"Delete". Rename the object with the "Удалить" prefix or remove the prefix from the synonym

MdObjectYoLetterCheck_title = The letter "ё" in the name, synonym or comment of a metadata object

MdObjectYoLetterCheck_description = The letter "ё" (in any case) should not be used in names, synonyms and comments of metadata objects; replace it with "е". The check covers every synonym language. For the letter "ё" in module texts see the check apk-00260-no-yo-letter. The АПК rule 00126.

MdObjectYoLetterCheck_Name_contains_yo = The name "{0}" contains the letter "ё". Replace it with "е"

MdObjectYoLetterCheck_Synonym_contains_yo = The synonym of "{0}" contains the letter "ё". Replace it with "е"

MdObjectYoLetterCheck_Comment_contains_yo = The comment of "{0}" contains the letter "ё". Replace it with "е"
MdObjectFrenchQuotesCheck_title = French quotes (guillemets) in metadata object properties

MdObjectFrenchQuotesCheck_description = In interface texts use only straight double quotes. French quotes (guillemets) are allowed only in help texts. The АПК rule 01196.

MdObjectFrenchQuotesCheck_message = French quotes (guillemets) are used in the property "{0}". Use straight double quotes instead

MdObjectFrenchQuotesCheck_Synonym = Synonym

MdObjectFrenchQuotesCheck_Comment = Comment

MdObjectFrenchQuotesCheck_Tooltip = Tooltip
MdAttributeHintMatchSynonymCheck_title = The hint of an attribute matches its synonym

MdAttributeHintMatchSynonymCheck_description = A hint that repeats the synonym of the attribute does not explain the purpose of the attribute to the user. Fill the hint with a meaningful explanation or leave it empty. Only attributes of objects included in a subsystem with the "Include in command interface" flag are checked, and attributes with an empty hint are not checked. The АПК rule 00134.

MdAttributeHintMatchSynonymCheck_message = The hint of the attribute "{0}" matches its synonym

MdTemplateLangPostfixCheck_title = Language postfix in the name of a binary data or HTML template

MdTemplateLangPostfixCheck_description = A binary data template or an HTML template that is subject to translation must be marked with a name postfix: an underscore followed by the code of the configuration default language, for example "_ru". When interface languages are added, a copy of such template is created per language instead of translating the template content. Common templates and templates of applied objects are checked; other template types are not checked. The АПК rule 00505.

MdTemplateLangPostfixCheck_Template_name_without_language_postfix = The name of the template "{0}" does not end with the postfix "_{1}", where "{1}" is the code of the configuration default language. Add the postfix to the template name so that a copy of the template is created per language on translation

MdTemplateEncodingCheck_title = Encoding other than utf-8 in a text or HTML template

MdTemplateEncodingCheck_description = The content of a text document template and of an HTML template must use the utf-8 encoding. A template whose content declares an encoding with the "encoding=" or "charset=" attribute (case-insensitive) with a value other than utf-8 is reported. Templates whose content is empty or not accessible from the project model are not checked. The АПК rule 00506.

MdTemplateEncodingCheck_Non_utf8_encoding = The content of the template "{0}" declares the encoding "{1}". Use utf-8 encoding in text and HTML templates
MdCommandNameLengthCheck_title = Command name length is more than 38 characters

MdCommandNameLengthCheck_description = To avoid scroll bars at the standard screen resolution, the name (synonym) of a command should not exceed 38 characters. Only commands and common commands available in the command interface are checked: the command (for a command of an object — the owner object) is included in a subsystem, where the subsystem itself and all its parent subsystems up to the root have the "Include in command interface" flag set. If the synonym is empty, the command name is checked. Commands whose group is a form command group are not checked. The АПК rule 00528.

MdCommandNameLengthCheck_message = The name "{0}" of the command is longer than {1} characters. Command section: "{2}"

MdCommandNameLengthCheck_parameter = Maximum command name length

MdSubsystemMembershipCheck_title = The object is not included in any subsystem

MdSubsystemMembershipCheck_description = Every object of the configuration should be included in at least one subsystem of the configuration subsystem tree, so it has a place in the configuration sections. Service objects that cannot be included in a subsystem composition (subsystems, languages, event subscriptions, common pictures, command groups, etc.) are not checked. The АПК rule 00458.

MdSubsystemMembershipCheck_message = The object "{0}" is not included in any subsystem
MdObjectChoiceHistoryOnInputCheck_title = The "History choice on input" property is not "Don't use"

MdObjectChoiceHistoryOnInputCheck_description = The "History choice on input" (рус. «История выбора при вводе») property of a metadata object must be "Don't use" (рус. «Не использовать»): for every Document unconditionally, and for every Catalog or Document whose manager module contains the data selection processing handler (рус. «ОбработкаПолученияДанныхВыбора»). A value that is not set is treated as "Auto" and reported. One issue per object. The АПК rule 00616.

MdObjectChoiceHistoryOnInputCheck_History_is_not_dont_use = The "History choice on input" property of the document is "{0}", expected "Don't use" (рус. «Не использовать»)

MdObjectChoiceHistoryOnInputCheck_Handler_requires_dont_use = The manager module contains the data selection processing handler (рус. «ОбработкаПолученияДанныхВыбора»), but the "History choice on input" property is "{0}", expected "Don't use" (рус. «Не использовать»)

CommonPictureDuplicateCheck_title = Common pictures with the identical content

CommonPictureDuplicateCheck_description = Two or more common pictures of the configuration must not have the identical content: a duplicated picture is edited in one place only, while the other copies keep the outdated image. The hash sum (MD5) of the content of each picture is computed, and pictures with the same hash sum are reported: every picture of a duplicate group is reported and the message lists all pictures of the group. Pictures with empty or not accessible content are not checked. The АПК rule 01146.

CommonPictureDuplicateCheck_Duplicate_pictures = The content of the common picture "{0}" is identical to the content of the common pictures: {1}
