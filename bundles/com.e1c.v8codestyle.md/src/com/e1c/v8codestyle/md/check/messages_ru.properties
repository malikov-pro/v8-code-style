DbObjectStringAllowedLengthCheck_title = У реквизита строкового типа допустимая длина фиксированная

DbObjectStringAllowedLengthCheck_description = Для реквизитов строкового типа следует использовать переменную длину строки (свойство «Допустимая длина» = «Переменная») и указывать максимально допустимую длину. Фиксированная длина оправдана, только когда действительно необходима гарантия, что строка имеет определенную длину. Правило АПК_00139.

DbObjectStringAllowedLengthCheck_message = У реквизита строкового типа «{0}» свойство «Допустимая длина» установлено в «Фиксированная». Используйте переменную длину, если нет необходимости в гарантии точной длины строки

DbObjectUnlimitedStringCheck_title = Реквизит строкового типа неограниченной длины

DbObjectUnlimitedStringCheck_description = Строки неограниченной длины допустимы только для пользовательских текстов значительного объёма или технической информации. Если максимально возможную длину строки можно оценить, используйте строку ограниченной длины. Проверка — ручной аудит, по умолчанию выключена. Правило АПК_00141.

DbObjectUnlimitedStringCheck_message = Реквизит «{0}» имеет строковый тип неограниченной длины. Если максимально возможную длину строки можно оценить, используйте строку ограниченной длины

MdObjectDeleteSynonymPrefixCheck_title = Префикс «Удалить» в имени устаревшего объекта не согласован с префиксом «(не используется)» в синониме

MdObjectDeleteSynonymPrefixCheck_description = Устаревший объект метаданных, который пока нельзя удалить из конфигурации, переименовывается с префиксом «Удалить» в имени, а в его синоним добавляется префикс «(не используется)». Префиксы в имени и синониме должны использоваться вместе. Правило АПК_00156.

MdObjectDeleteSynonymPrefixCheck_Name_prefix_without_synonym_prefix = Имя «{0}» начинается с «Удалить», но синоним «{1}» не начинается с «(не используется)». Добавьте префикс «(не используется)» в синоним либо удалите устаревший объект

MdObjectDeleteSynonymPrefixCheck_Synonym_prefix_without_name_prefix = Синоним «{1}» начинается с «(не используется)», но имя «{0}» не начинается с «Удалить». Добавьте префикс «Удалить» в имя либо уберите префикс из синонима

MdObjectYoLetterCheck_title = Буква «ё» в имени, синониме или комментарии объекта метаданных

MdObjectYoLetterCheck_description = В именах, синонимах и комментариях объектов метаданных не допускается использовать букву «ё» (в любом регистре) — заменяйте её на «е». Проверяются синонимы на всех языках. Для буквы «ё» в текстах модулей предназначена проверка apk-00260-no-yo-letter. Правило АПК_00126.

MdObjectYoLetterCheck_Name_contains_yo = Имя «{0}» содержит букву «ё». Замените её на «е»

MdObjectYoLetterCheck_Synonym_contains_yo = Синоним объекта «{0}» содержит букву «ё». Замените её на «е»

MdObjectYoLetterCheck_Comment_contains_yo = Комментарий объекта «{0}» содержит букву «ё». Замените её на «е»
MdObjectFrenchQuotesCheck_title = Французские кавычки «ёлочки» в свойствах объектов метаданных

MdObjectFrenchQuotesCheck_description = В интерфейсных текстах следует использовать только прямые двойные кавычки. Французские кавычки «ёлочки» допустимы только в текстах справки. Правило АПК_01196.

MdObjectFrenchQuotesCheck_message = В свойстве "{0}" использованы французские кавычки «ёлочки» — используйте прямые двойные кавычки

MdObjectFrenchQuotesCheck_Synonym = Синоним

MdObjectFrenchQuotesCheck_Comment = Комментарий

MdObjectFrenchQuotesCheck_Tooltip = Подсказка
MdAttributeHintMatchSynonymCheck_title = Подсказка реквизита совпадает с синонимом

MdAttributeHintMatchSynonymCheck_description = Подсказка, повторяющая синоним реквизита, не поясняет пользователю назначение реквизита. Заполните подсказку осмысленным пояснением или оставьте её пустой. Проверяются только реквизиты объектов, включённых в подсистему с флагом «Включать в командный интерфейс», а реквизиты с пустой подсказкой не проверяются. Правило АПК_00134.

MdAttributeHintMatchSynonymCheck_message = Подсказка реквизита «{0}» совпадает с синонимом

MdTemplateLangPostfixCheck_title = Постфикс кода основного языка в имени двоичного макета или HTML-макета

MdTemplateLangPostfixCheck_description = Двоичный макет или HTML-макет, подлежащий переводу, должен быть помечен постфиксом в имени: подчёркивание и код основного языка конфигурации, например «_ru». При добавлении языков интерфейса для такого макета создаётся копия на каждый язык, а не переводится его содержимое. Проверяются общие макеты и макеты прикладных объектов; остальные типы макетов не проверяются. Правило АПК_00505.

MdTemplateLangPostfixCheck_Template_name_without_language_postfix = Имя макета «{0}» не оканчивается на постфикс «_{1}», где «{1}» — код основного языка конфигурации. Добавьте постфикс в имя макета, чтобы при переводе для него создавалась копия на каждый язык

MdTemplateEncodingCheck_title = Кодировка, отличная от utf-8, в текстовом или HTML-макете

MdTemplateEncodingCheck_description = Содержимое текстового макета и HTML-макета должно быть в кодировке utf-8. Сообщается о макете, в содержимом которого объявлена кодировка атрибутом «encoding=» или «charset=» (регистронезависимо) со значением, отличным от utf-8. Макеты с пустым или недоступным из модели проекта содержимым не проверяются. Правило АПК_00506.

MdTemplateEncodingCheck_Non_utf8_encoding = В содержимом макета «{0}» объявлена кодировка «{1}». Используйте в текстовых и HTML-макетах кодировку utf-8
MdCommandNameLengthCheck_title = Длина названия команды больше 38 символов

MdCommandNameLengthCheck_description = Чтобы при стандартном разрешении экрана не возникало полос прокрутки, название (синоним) команды не должно превышать 38 символов. Проверяются только команды и общие команды, доступные в командном интерфейсе: команда (для команды объекта — объект-владелец) входит в подсистему, у которой сама подсистема и все её родительские подсистемы до корня имеют включённый флаг «Включать в командный интерфейс». Если синоним пуст, проверяется имя команды. Команды, группа которых относится к группе формы, не проверяются. Правило АПК_00528.

MdCommandNameLengthCheck_message = Название команды «{0}» длиннее {1} символов. Раздел команды: «{2}»

MdCommandNameLengthCheck_parameter = Максимальная длина названия команды

MdSubsystemMembershipCheck_title = Объект не входит ни в одну подсистему

MdSubsystemMembershipCheck_description = Каждый объект конфигурации должен входить хотя бы в одну подсистему дерева подсистем конфигурации, чтобы иметь место в разделах конфигурации. Служебные объекты, которые не могут входить в состав подсистем (подсистемы, языки, подписки на события, общие картинки, группы команд и т.п.), не проверяются. Правило АПК_00458.

MdSubsystemMembershipCheck_message = Объект «{0}» не входит ни в одну подсистему
MdObjectChoiceHistoryOnInputCheck_title = Свойство «История выбора при вводе» не равно «Не использовать»

MdObjectChoiceHistoryOnInputCheck_description = Свойство «История выбора при вводе» объекта метаданных должно быть в значении «Не использовать»: у всех документов безусловно, а у справочников и документов, в модуле менеджера которых есть обработчик «ОбработкаПолученияДанныхВыбора». Не заданное значение приравнивается к «Авто» и помечается. Одно замечание на объект. Правило АПК_00616.

MdObjectChoiceHistoryOnInputCheck_History_is_not_dont_use = Значение свойства «История выбора при вводе» у документа — «{0}» (ожидалось: «Не использовать»)

MdObjectChoiceHistoryOnInputCheck_Handler_requires_dont_use = В модуле менеджера есть обработчик «ОбработкаПолученияДанныхВыбора», а значение свойства «История выбора при вводе» — «{0}» (ожидалось: «Не использовать»)

CommonPictureDuplicateCheck_title = Общие картинки с одинаковым содержимым

CommonPictureDuplicateCheck_description = Две и более общие картинки конфигурации не должны иметь одинаковое содержимое: дублируемая картинка редактируется в одном месте, а остальные копии остаются с устаревшим изображением. Для каждой общей картинки вычисляется хеш-сумма (MD5) её содержимого, картинки с одинаковой хеш-суммой помечаются: замечание получает каждая картинка группы дубликатов, в сообщении перечисляются все картинки группы. Картинки с пустым или недоступным из модели проекта содержимым не проверяются. Правило АПК_01146.

CommonPictureDuplicateCheck_Duplicate_pictures = Содержимое общей картинки «{0}» совпадает с содержимым общих картинок: {1}
MdExtendedListPresentationEqualsCheck_title = Расширенное представление списка совпадает с представлением списка

MdExtendedListPresentationEqualsCheck_description = Расширенное представление списка задаётся полным названием списка объектов и показывается вместо представления списка, поэтому оно имеет смысл, только когда отличается от представления списка (стандарт 468, п. 5). Если хотя бы для одного языка расширенное представление списка совпадает с представлением списка, оно бессмысленно и заполнять его не нужно. Сравниваются все языки, для которых заданы оба представления, без учёта регистра и пробелов по краям. Проверяются объекты метаданных верхнего уровня, у которых есть представления списка: справочники, документы и другие объекты БД, регистры сведений, накопления, бухгалтерские и расчёта, перечисления, журналы документов и критерии отбора. Случай, когда представление списка не заполнено, а расширенное представление совпадает с синонимом, не проверяется (отдельное правило АПК 1216). Правило АПК 1215.

MdExtendedListPresentationEqualsCheck_message = Расширенное представление списка «{0}» совпадает с представлением списка

MdExtendedObjectPresentationEqualsCheck_title = Расширенное представление объекта совпадает с представлением объекта

MdExtendedObjectPresentationEqualsCheck_description = Расширенное представление объекта (для регистра — расширенное представление записи) задаётся полным названием объекта в единственном числе и показывается вместо представления объекта, поэтому оно имеет смысл, только когда отличается от представления объекта (стандарт 468, п. 3). Если хотя бы для одного языка расширенное представление объекта совпадает с представлением объекта, оно бессмысленно и заполнять его не нужно. Сравниваются все языки, для которых заданы оба представления, без учёта регистра и пробелов по краям. Проверяются объекты БД верхнего уровня (справочники, документы и др.) и регистры сведений. Случай, когда представление объекта не заполнено, а расширенное представление совпадает с синонимом, не проверяется (отдельное правило АПК 1213). Правило АПК 1211.

MdExtendedObjectPresentationEqualsCheck_message = Расширенное представление объекта «{0}» совпадает с представлением объекта

MdToolTipEmptyCheck_title = Не заполнена всплывающая подсказка

MdToolTipEmptyCheck_description = Чтобы пояснить назначение элемента управления пользователю, выводимому в интерфейсе реквизиту назначается всплывающая подсказка; заполнение подсказки обязательно (стандарт 506). Проверяются реквизиты с заполненным синонимом у объектов, включённых хотя бы в одну подсистему с флагом «Включать в командный интерфейс»: реквизиты объектов, реквизиты табличных частей, измерения и ресурсы регистров, а также стандартные реквизиты Код, Наименование, Родитель, Владелец и Период («Период» непериодического регистра сведений не проверяется). Реквизиты без синонима не проверяются. Правило АПК 1136.

MdToolTipEmptyCheck_message = Не заполнена всплывающая подсказка реквизита «{0}»
