CommandViewRightsCheck_title = No role has view right for the command

CommandViewRightsCheck_description = Checks that at least one role grants the View right for the owner object of a command that is available in the command interface. Rights for a command derive from the rights of its owner object: if no role grants the View right for the owner object, users can never see or open the command. Only commands of configuration objects available in the command interface (the owner object is included in a subsystem with the Include in command interface flag set in the whole chain up to the root) are checked; a common command has no owner object and is not checked. Standard 689.

CommandViewRightsCheck_No_role_has_view_right = The command is available in the command interface, but no role grants the View right for the object "{0}": grant the View right in the role that gives access to the object

CommandReadWithoutViewRightsCheck_title = Role with access to the object has no view right for the command

CommandReadWithoutViewRightsCheck_description = Checks that a role granting the Read or View right for the owner object of a command available in the command interface also grants the View right for the command itself. A user holding such a role sees the object but never sees or opens the command, so the command is unavailable in the interface of the role. Only commands of configuration objects available in the command interface (the owner object is included in a subsystem with the Include in command interface flag set in the whole chain up to the root) are checked; a common command has no owner object and is not checked. Standard 689.

CommandReadWithoutViewRightsCheck_Role_access_to_object_without_command_view = The role "{0}" grants the Read or View right for the object "{1}", but does not grant the View right for the command: grant the View right for the command in the role that gives access to the object

