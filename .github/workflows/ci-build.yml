name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches: 
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Write access is limited to pushes, manual runs and same-repository PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/build.yml
    with:
      analyze: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  fork-build:
    name: Fork build (read-only)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !contains(github.event.pull_request.labels.*.name, 'Analyze')
    permissions:
      contents: read
      checks: none
    uses: ./.github/workflows/build.yml
    with:
      analyze: false
