name: Релиз

# Пуш тега вида 0.8.0 из master: сборка обоих профилей (EDT 2026.1 + 2026.2)
# → GitHub Release с двумя p2-zip. Публикация релиза дёргает
# deploy-update-site.yml (обновление Pages).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Актуализация
        uses: actions/checkout@v4

      - name: Установка JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64

      - name: Кеширование m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('targets/edt-2026.1/edt-2026.1.target') }}
          restore-keys: ${{ runner.os }}-m2-

      # версия релиза = тег: снимаем -SNAPSHOT в pom и MANIFEST/feature
      # (только в рабочем дереве, коммит не делаем)
      - name: Версия из тега
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Тег «${TAG}» не вида X.Y.Z"; exit 1
          fi
          if ! grep -q "<version>${TAG}-SNAPSHOT</version>" pom.xml; then
            echo "pom в ${TAG} версии ${TAG}-SNAPSHOT — сначала поднимите версию в master"; exit 1
          fi
          mvn -B org.eclipse.tycho:tycho-versions-plugin:5.0.2:set-version \
            -DnewVersion="${TAG}" -DgenerateBackupPoms=false
          # bom — родитель вне реактора, set-version его не обновляет
          for f in bom/pom.xml pom.xml; do
            sed -i "s|<version>${TAG}-SNAPSHOT</version>|<version>${TAG}</version>|" "$f"
          done
          grep -q "<version>${TAG}</version>" bom/pom.xml || {
            echo "bom/pom.xml: не удалось проставить версию ${TAG}"; exit 1
          }

      # оба профиля, без itests (тесты гоняются локально перед тегом — ~35 мин).
      # edt.1c.ru обрывает отдачу крупных нативок раннерам GitHub (Premature EOF
      # на natives.library) — каждая сборка с ретраями (p2-кэш докачивает).
      - name: Сборка EDT 2026.1 (основная)
        run: |
          for i in 1 2 3; do
            echo "=== Попытка $i ==="
            if mvn -B clean verify -DskipTests -Dtycho.localArtifacts=ignore -Dtycho.p2.httptransport.type=JavaUrl; then
              break
            elif [ "$i" = "3" ]; then
              exit 1
            else
              sleep 30
            fi
          done

      - name: Zip EDT 2026.1
        run: |
          mkdir -p dist
          cp repositories/com.e1c.v8codestyle.repository/target/*.zip \
             dist/v8codestyle-edt2026.1-${GITHUB_REF_NAME}.zip

      - name: Сборка EDT 2026.2 (пре-релиз)
        run: |
          for i in 1 2 3; do
            echo "=== Попытка $i ==="
            if mvn -B clean verify -DskipTests -Dtycho.localArtifacts=ignore -Dtycho.p2.httptransport.type=JavaUrl -Pedt-2026.2; then
              break
            elif [ "$i" = "3" ]; then
              exit 1
            else
              sleep 30
            fi
          done

      - name: Zip EDT 2026.2
        run: |
          cp repositories/com.e1c.v8codestyle.repository/target/*.zip \
             dist/v8codestyle-edt2026.2-${GITHUB_REF_NAME}.zip

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
