name: Релиз

# Пуш тега вида 0.8.0 из master: сборка обоих профилей (EDT 2026.1 + 2026.2)
# → GitHub Release с двумя p2-zip. Публикация релиза дёргает
# deploy-update-site.yml (обновление Pages).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег релиза X.Y.Z (повторная публикация без изменения тега)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Проверка тега
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Тег «${RELEASE_TAG}» не вида X.Y.Z"; exit 1
          fi

      - name: Актуализация
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Установка JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64

      # Maven 3.10 отвергает classifier lib/*.jar, который инжектирует Tycho.
      # Совпадает с локальным compile.sh; eclipse-tycho/tycho#6399.
      - name: Установка Maven 3.9.9
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: '3.9.9'

      - name: Версии тулчейна
        run: mvn --version

      - name: Кеширование m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('targets/edt-2026.1/edt-2026.1.target') }}
          restore-keys: ${{ runner.os }}-m2-

      # версия релиза = тег: снимаем -SNAPSHOT в pom и MANIFEST/feature
      # (только в рабочем дереве, коммит не делаем)
      - name: Версия из тега
        run: |
          TAG="${RELEASE_TAG}"
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Тег «${TAG}» не вида X.Y.Z"; exit 1
          fi
          if ! grep -q "<version>${TAG}-SNAPSHOT</version>" pom.xml; then
            echo "pom в ${TAG} версии ${TAG}-SNAPSHOT — сначала поднимите версию в master"; exit 1
          fi
          mvn -B org.eclipse.tycho:tycho-versions-plugin:5.0.2:set-version \
            -DnewVersion="${TAG}" -DgenerateBackupPoms=false
          # bom — родитель вне реактора, set-version его не обновляет
          for f in bom/pom.xml pom.xml; do
            sed -i "s|<version>${TAG}-SNAPSHOT</version>|<version>${TAG}</version>|" "$f"
          done
          grep -q "<version>${TAG}</version>" bom/pom.xml || {
            echo "bom/pom.xml: не удалось проставить версию ${TAG}"; exit 1
          }

      # оба профиля, без itests (тесты гоняются локально перед тегом — ~35 мин).
      # edt.1c.ru обрывает отдачу крупных нативок раннерам GitHub (Premature EOF
      # на natives.library) — каждая сборка с ретраями (p2-кэш докачивает).
      - name: Сборка EDT 2026.1 (основная)
        run: |
          for i in 1 2 3; do
            echo "=== Попытка $i ==="
            if mvn -B clean verify -DskipTests -Dtycho.localArtifacts=ignore -Dtycho.p2.httptransport.type=JavaUrl; then
              break
            elif [ "$i" = "3" ]; then
              exit 1
            else
              sleep 30
            fi
          done

      - name: Zip EDT 2026.1
        run: |
          mkdir -p dist
          cp repositories/com.e1c.v8codestyle.repository/target/*.zip \
             dist/v8codestyle-edt2026.1-${RELEASE_TAG}.zip

      - name: Сборка EDT 2026.2 (пре-релиз)
        run: |
          for i in 1 2 3; do
            echo "=== Попытка $i ==="
            if mvn -B clean verify -DskipTests -Dtycho.localArtifacts=ignore -Dtycho.p2.httptransport.type=JavaUrl -Pedt-2026.2; then
              break
            elif [ "$i" = "3" ]; then
              exit 1
            else
              sleep 30
            fi
          done

      - name: Zip EDT 2026.2
        run: |
          cp repositories/com.e1c.v8codestyle.repository/target/*.zip \
             dist/v8codestyle-edt2026.2-${RELEASE_TAG}.zip

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" dist/*.zip \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes
